[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "favonius-energy"
version = "0.1.0"
description = "EV Fleet Depot Optimization Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Favonius Energy Team"}
]
keywords = ["ev", "charging", "optimization", "ocpp", "energy-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core WebSocket and OCPP
    "websockets>=12.0",
    "ocpp>=2.1.0",
    "uvloop>=0.19.0",
    # Async utilities
    "aiofiles>=23.2.1",
    "aiohttp>=3.9.3",
    "aiocontextvars>=0.2.2",
    "asyncio-mqtt>=0.16.1",
    # Data serialization and validation
    "pydantic>=2.5.0",
    "msgpack>=1.0.7",
    "jsonschema>=4.20.0",
    # Monitoring and observability
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "colorlog>=6.8.0",
    # Security and TLS
    "cryptography>=41.0.8",
    "pyopenssl>=23.3.0",
    "bcrypt>=5.0.0",
    # JWT (Supabase auth, JWKS for asymmetric signing keys ≥ 2.4.0)
    "PyJWT[crypto]>=2.8.0",
    # Geo-blocking (Article 73-3 compliance)
    "geoip2>=4.8.0",
    # Configuration management
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # Resilience and error handling
    "backoff>=2.2.1",
    "tenacity>=8.2.3",
    # Supabase integration
    "supabase>=2.3.0",
    "postgrest>=0.13.0",
    "asyncpg>=0.29.0",
    # TimescaleDB integration
    "psycopg2-binary>=2.9.7",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Optimization (MILP solver)
    # Per PRD_v2.md Section 8.2: Gurobi primary, HiGHS fallback
    "pyomo>=6.7.0",
    "gurobipy>=11.0.0", # Primary solver (requires license)
    "highspy>=1.5.0", # Fallback solver (open-source)
    # Machine Learning (Surrogate Model)
    "scikit-learn>=1.3.0",
    # API framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Email templates (alerts pipeline; see docs/plans/alerts-pipeline.md)
    "jinja2>=3.1.0",
    # Weather API
    "openmeteo-requests>=1.2.0",
    "requests-cache>=1.1.0",
    "retry-requests>=2.0.0",
    "httpx>=0.25.0",
    # Security: XXE-safe XML parsing
    "defusedxml>=0.7.1",
    # LLM-powered depot chat agent (see docs/plans/agent_search_architecture_v0.md §4)
    # Model is selected via AGENT_LLM_MODEL env var; API key via secrets.py.
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    # Development and testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.2",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    # Code quality
    "black>=23.12.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    # Performance monitoring
    "psutil>=5.9.6",
    "py-spy>=0.3.14",
]

[project.urls]
Homepage = "https://github.com/favonius-energy/favonius-backend"
Documentation = "https://github.com/favonius-energy/favonius-backend/blob/main/README.md"
Repository = "https://github.com/favonius-energy/favonius-backend"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.j2"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

# mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv/",
    "build/",
    "dist/",
    "tests/",
]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--color=yes",
    "--durations=10",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "load: Load tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "docker: Tests requiring Docker",
    "compliance: OCPP compliance tests",
    "critical: Critical path tests",
    "edge_case: Edge case tests",
    "security: Security tests",
    "snapshot: Snapshot tests against the live LLM (gated; nightly only)",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@\\(abc\\.\\)?abstractmethod",
]
fail_under = 80
show_missing = true
precision = 2


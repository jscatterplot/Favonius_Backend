# Redis Cluster Configuration for EV Charging Platform
# This configuration is optimized for V2G real-time operations

# Basic settings
bind 0.0.0.0
port 6379
protected-mode no
daemonize no

# Cluster configuration
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 15000
cluster-announce-ip REDIS_ANNOUNCE_IP
cluster-announce-port 6379
cluster-announce-bus-port 16379

# Memory management
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Performance tuning
hz 10
dynamic-hz yes
tcp-keepalive 300
tcp-backlog 511
timeout 0

# Persistence optimized for real-time data
save 900 1
save 300 10  
save 60 10000

# AOF for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Networking
tcp-keepalive 300
tcp-nodelay yes

# Client management
maxclients 10000
timeout 0

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Security (password will be set via environment)
# requirepass will be configured via startup script

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Memory usage optimization for time series
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Stream configuration for grid signals
stream-node-max-bytes 4096
stream-node-max-entries 100

# Replica settings
replica-serve-stale-data yes
replica-read-only yes
replica-priority 100

# Danger zone - advanced settings
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
rdb-del-sync-files no

# Enable modules if Redis Stack is available
# loadmodule /opt/redis-stack/lib/redistimeseries.so
# loadmodule /opt/redis-stack/lib/rejson.so

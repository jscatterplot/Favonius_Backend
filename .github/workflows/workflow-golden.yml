# Workflow eval golden gate.
#
# Per PRD principle 6 the evaluation harness ships before the workflow,
# and per the §6.1 acceptance bar every workflow lands with ≥10 frozen
# scenarios. This workflow runs both:
#
#  1. The harness unit tests under tests/unit/agent_workflows/ — pure
#     Python, gates that the runner itself is healthy.
#  2. The parametrised workflow_golden tests under
#     tests/golden/workflows/ — these need TimescaleDB so we spin one
#     up as a service container and run the full migrations against it
#     before invoking the gate.
#
# Trigger: PRs that touch the runtime, the harness, or any scenario
# YAML. Pushes to main also run so the default branch is always green.

name: workflow-golden

on:
  pull_request:
    paths:
      - "src/api/agent_workflows/**"
      - "tests/golden/workflows/**"
      - "tests/unit/agent_workflows/**"
      - "migrations/**"
      - ".github/workflows/workflow-golden.yml"
  push:
    branches:
      - main
    paths:
      - "src/api/agent_workflows/**"
      - "tests/golden/workflows/**"
      - "tests/unit/agent_workflows/**"
      - "migrations/**"

concurrency:
  group: workflow-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run runner unit tests with coverage
        # Coverage is scoped to the eval module — runtime/repository
        # have their own dedicated suites
        # (tests/unit/test_agent_workflows_*.py). This job's job is to
        # gate the harness itself.
        run: |
          pytest tests/unit/agent_workflows/ \
            --cov=src/api/agent_workflows/eval \
            --cov-report=term \
            --cov-fail-under=90

  golden:
    name: Workflow-golden scenarios
    runs-on: ubuntu-latest
    needs: unit
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: favonius_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: favonius_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U favonius_test -d favonius_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://favonius_test:test_password@localhost:5433/favonius_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "jsonschema>=4.20.0"
      - name: Apply migrations
        run: python scripts/run_migrations.py
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run workflow-golden gate
        # `-m workflow_golden` selects only the parametrised gate +
        # example scenarios. The bare `tests/golden/workflows/` path
        # is included so the no-DB invariant tests
        # (test_schema_file_exists, test_examples_validate_against_schema)
        # also run.
        run: |
          pytest tests/golden/workflows/ \
            -m "workflow_golden or not workflow_golden" \
            --tb=short

# Prometheus configuration for EV Charging WebSocket Handler
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # WebSocket Handler metrics
  - job_name: 'websocket-handler'
    static_configs:
      - targets: ['websocket-handler:8080']
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: http
    honor_labels: true
    
    # Relabeling to add additional labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: websocket-handler:8080
      - target_label: service
        replacement: websocket-handler
      - target_label: component
        replacement: ocpp-server

  # Kubernetes service discovery for pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['ev-charging']
    
    relabel_configs:
      # Only scrape pods with prometheus.io/scrape annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      # Use custom metrics path if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      # Use custom port if specified
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      
      # Add pod metadata as labels
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Kafka monitoring (if using JMX exporter)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9308']  # Assuming JMX exporter on port 9308
    scrape_interval: 30s

  # Node exporter for system metrics (if deployed)
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):10250'
        target_label: __address__
        replacement: '${1}:9100'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Sample alerting rules (would typically be in separate files)
rule_files:
  - "alert_rules.yml"
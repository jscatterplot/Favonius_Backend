# Prometheus configuration for Favonius Energy EV Fleet Depot Optimization Platform
#
# Reference: PRD_v2.md Section 10.1 (Performance Requirements)
#            Development Plan Phase 7
#
# Metrics tracked per PRD:
# - Optimization metrics (runs, duration, failures, solver usage)
# - OCPP dispatch metrics (success/failure)
# - Control loop metrics (uptime, state)
# - Solver reliability metrics (solver_used_total, solver_fallback_total)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Main Application API metrics
  # Per PRD Section 10.1: API response time < 500ms (99th percentile)
  - job_name: 'favonius-api'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scheme: http
    relabel_configs:
      - target_label: service
        replacement: favonius-api
      - target_label: component
        replacement: api-server

  # OCPP Server metrics (integrated with API service)
  # Per PRD Section 9.1: OCPP 1.6 primary, 2.0.1 ready
  - job_name: 'favonius-ocpp'
    static_configs:
      - targets: ['api:8000']
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: http
    relabel_configs:
      - target_label: service
        replacement: favonius-ocpp
      - target_label: component
        replacement: ocpp-server

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Configure alertmanager if needed

# Alert rules for critical metrics
# Per PRD Section 10.2: System availability >= 99.5%
rule_files: []
  # Add alert rules files here when needed:
  # - "alert_rules.yml"

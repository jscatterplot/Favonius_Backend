# Redis Cluster setup for EV Charging Platform
version: '3.8'

services:
  # Redis Cluster Nodes (3 masters + 3 replicas)
  redis-cluster-1:
    image: redis:7.2-alpine
    container_name: redis-cluster-1
    ports:
      - "7001:6379"
      - "17001:16379"
    volumes:
      - ./redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cluster_1_data:/data
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
      REDIS_ANNOUNCE_IP: redis-cluster-1
      REDIS_NODE_ID: 1
    command: ["cluster-entrypoint.sh"]
    networks:
      - redis-cluster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  redis-cluster-2:
    image: redis:7.2-alpine
    container_name: redis-cluster-2
    ports:
      - "7002:6379" 
      - "17002:16379"
    volumes:
      - ./redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cluster_2_data:/data
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
      REDIS_ANNOUNCE_IP: redis-cluster-2
      REDIS_NODE_ID: 2
    command: ["cluster-entrypoint.sh"]
    networks:
      - redis-cluster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  redis-cluster-3:
    image: redis:7.2-alpine
    container_name: redis-cluster-3
    ports:
      - "7003:6379"
      - "17003:16379"
    volumes:
      - ./redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cluster_3_data:/data
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
      REDIS_ANNOUNCE_IP: redis-cluster-3
      REDIS_NODE_ID: 3
    command: ["cluster-entrypoint.sh"]
    networks:
      - redis-cluster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  redis-cluster-4:
    image: redis:7.2-alpine
    container_name: redis-cluster-4
    ports:
      - "7004:6379"
      - "17004:16379"
    volumes:
      - ./redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cluster_4_data:/data
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
      REDIS_ANNOUNCE_IP: redis-cluster-4
      REDIS_NODE_ID: 4
    command: ["cluster-entrypoint.sh"]
    networks:
      - redis-cluster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  redis-cluster-5:
    image: redis:7.2-alpine
    container_name: redis-cluster-5
    ports:
      - "7005:6379"
      - "17005:16379"
    volumes:
      - ./redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cluster_5_data:/data
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
      REDIS_ANNOUNCE_IP: redis-cluster-5
      REDIS_NODE_ID: 5
    command: ["cluster-entrypoint.sh"]
    networks:
      - redis-cluster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  redis-cluster-6:
    image: redis:7.2-alpine
    container_name: redis-cluster-6
    ports:
      - "7006:6379"
      - "17006:16379"
    volumes:
      - ./redis/redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cluster_6_data:/data
      - ./redis/cluster-entrypoint.sh:/usr/local/bin/cluster-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
      REDIS_ANNOUNCE_IP: redis-cluster-6
      REDIS_NODE_ID: 6
    command: ["cluster-entrypoint.sh"]
    networks:
      - redis-cluster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis Cluster Initialization
  redis-cluster-init:
    image: redis:7.2-alpine
    container_name: redis-cluster-init
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
      - redis-cluster-4
      - redis-cluster-5
      - redis-cluster-6
    volumes:
      - ./redis/cluster-init.sh:/usr/local/bin/cluster-init.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
    command: ["cluster-init.sh"]
    networks:
      - redis-cluster-network
    profiles: ["init"]

  # Redis Cluster Manager/Monitor
  redis-cluster-monitor:
    image: redis:7.2-alpine
    container_name: redis-cluster-monitor
    depends_on:
      - redis-cluster-1
      - redis-cluster-2
      - redis-cluster-3
    volumes:
      - ./redis/cluster-monitor.sh:/usr/local/bin/cluster-monitor.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-cluster-pass}
    command: ["cluster-monitor.sh"]
    networks:
      - redis-cluster-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # Redis Insight for cluster management (optional)
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8001:8001"
    volumes:
      - redis_insight_data:/db
    networks:
      - redis-cluster-network
    restart: unless-stopped
    profiles: ["tools"]

volumes:
  redis_cluster_1_data:
    driver: local
  redis_cluster_2_data:
    driver: local
  redis_cluster_3_data:
    driver: local
  redis_cluster_4_data:
    driver: local
  redis_cluster_5_data:
    driver: local
  redis_cluster_6_data:
    driver: local
  redis_insight_data:
    driver: local

networks:
  redis-cluster-network:
    name: redis-cluster-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

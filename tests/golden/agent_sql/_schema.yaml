# Agent-SQL golden eval scenario — schema reference (PLAN.md session S2).
#
# Sibling to tests/golden/workflows/_schema.yaml (the workflow gate) and
# tests/golden/agent_consumption.yaml (the chat-agent extraction gate).
# This file is the JSON-Schema-style description every scenario in
# tests/golden/agent_sql.yaml is validated against by
# tests/golden/test_agent_sql_golden.py before it runs.
#
# WHAT A SCENARIO DOES
# --------------------
# One scenario drives the depot chat agent's SQL mode end-to-end through
# src.api.agent_workflows.runtime.run_qa_turn — the SAME tool-use loop the
# production controller uses — but with a deterministic FakeAnthropicClient
# replaying a hand-written `llm_trace` instead of a live model. The canned
# SQL inside the trace is validated by the REAL src/api/agent/sql_validator
# and executed by the REAL src/api/agent/sql_executor (role swap + EXPLAIN
# preflight) against the curated `agent_views.*` table-functions, reading
# the scenario's `graph_snapshot` rows loaded into a transactional savepoint
# on a real TimescaleDB + Supabase pair. The transaction is always rolled
# back — pass or fail.
#
# DETERMINISM CONTRACT
# --------------------
# * The fake client replays `llm_trace` verbatim, so the LLM-driven part of
#   the turn is fully deterministic. Author the SQL with ABSOLUTE literal
#   time bounds (e.g. `WHERE start_time >= '2026-04-01'`) rather than
#   `now()`-relative windows, so the agent_views aggregates over the fixture
#   rows reproduce on every run regardless of wall-clock date. (The agent
#   functions sessions / optimization_runs / alerts / connector_status_latest
#   impose no now()-window; only schedules_recent does, which the v1 eval
#   categories never touch.)
# * All UUIDs in `graph_snapshot` are explicit and stable. No
#   gen_random_uuid() in the snapshot.
# * `scenario_now` anchors any relative offset time fields; bare `now()`-style
#   snapshot values are refused by the loader.
#
# LLM-TRACE SQL RULES (enforced by the real validator at run time)
# ----------------------------------------------------------------
# * Every FROM/JOIN target is `agent_views.<fn>($1)` — never a base table.
# * The only bind placeholder is `$1` (the server binds it to the caller's
#   visible_depot_ids; the harness sets those from graph_snapshot.depots).
# * Hypertable functions (prices_hourly, building_load_hourly) require a
#   bounding time predicate on their `hour` column.
# See src/api/agent/catalogue.py for the canonical column names, units and
# enum values these queries must use, and migrations/042_agent_views_ts.sql +
# migrations/supabase/040_agent_views_static.sql for the ground-truth function
# signatures.

$schema: "https://json-schema.org/draft-07/schema#"
title: "Agent-SQL eval scenario"
type: object
required:
  - id
  - category
  - question
  - graph_snapshot
  - llm_trace
  - expected
additionalProperties: false

properties:
  id:
    type: string
    description: |
      Unique slug across the suite. Convention: `<cat>_<nn>`, matching the
      PLAN.md §"Eval spec" numbering — energy_cost → en_01..en_07,
      ops_status → ops_08..ops_14, pricing_market → pm_15..pm_20.
    pattern: "^[a-z][a-z0-9_]*$"

  category:
    type: string
    enum: [energy_cost, ops_status, pricing_market]

  question:
    type: string
    minLength: 1
    description: The operator's natural-language question (the turn's user message).

  description:
    type: string

  scenario_now:
    type: string
    description: |
      ISO-8601 "now" anchor for any relative offset time fields in the
      snapshot. Optional; defaults to a fixed anchor in the loader. SQL in
      `llm_trace` should use absolute literal bounds, so most scenarios use
      absolute snapshot timestamps and never need this.
    format: date-time

  auth:
    type: object
    additionalProperties: false
    description: |
      Auth context the turn runs under. `visible_depot_ids` is derived from
      the snapshot's depots when absent (that is the $1 binding for every
      agent_views.<fn>($1) call, and the cross-tenant boundary).
    properties:
      user_id:         { type: string, format: uuid }
      organization_id: { type: string, format: uuid }
      role:            { type: string }
      visible_depot_ids:
        type: array
        items: { type: string, format: uuid }

  page_context:
    type: object
    additionalProperties: true
    description: |
      Optional already-sanitized page/view context the `get_page_context`
      tool returns verbatim (the payload shape produced by
      src/api/agent/view_context.py::build_page_context_payload — `available`,
      `note`, `view`, optional `depot_id`/`focus`). Lets a scenario exercise
      the ambiguity → get_page_context → query path. Absent ⇒ the tool returns
      {"available": false}.

  graph_snapshot:
    type: object
    additionalProperties: false
    description: |
      Fixture rows. Static-pool tables (depots/vehicles/drivers/chargers) load
      into the Supabase test DB; TS-pool tables (sessions/optimization_runs/
      alerts/electricity_prices/building_load/connector_status) load into the
      TimescaleDB test DB. Both are loaded into a per-scenario savepoint that
      rolls back afterwards.
    properties:
      # ── static pool (Supabase: sites / vehicles / drivers / charging_stations) ──
      depots:
        type: array
        items:
          type: object
          required: [depot_id, name]
          additionalProperties: false
          properties:
            depot_id:        { type: string, format: uuid }
            organization_id: { type: string, format: uuid }
            name:            { type: string }
            timezone:        { type: string }
            currency:        { type: string }
            max_grid_kw:     { type: number }
            latitude:        { type: number }
            longitude:       { type: number }
            entsoe_zone:     { type: [string, "null"] }
      vehicles:
        type: array
        items:
          type: object
          required: [vehicle_id, depot_id]
          additionalProperties: false
          properties:
            vehicle_id:           { type: string, format: uuid }
            depot_id:             { type: string, format: uuid }
            vin:                  { type: [string, "null"] }
            license_plate:        { type: [string, "null"] }
            battery_capacity_kwh: { type: number }
            max_charge_rate_kw:   { type: number }
            v2g_capable:          { type: boolean }
            status:               { type: string }
      drivers:
        type: array
        items:
          type: object
          required: [driver_id, depot_id]
          additionalProperties: false
          properties:
            driver_id:          { type: string, format: uuid }
            depot_id:           { type: string, format: uuid }
            display_name:       { type: string }
            external_driver_id: { type: [string, "null"] }
            email:              { type: [string, "null"] }
            status:             { type: string }
      chargers:
        type: array
        items:
          type: object
          required: [charger_id, depot_id]
          additionalProperties: false
          properties:
            charger_id:     { type: string, format: uuid }
            depot_id:       { type: string, format: uuid }
            ocpp_id:        { type: string }
            rated_kw:       { type: number }
            connector_type: { type: string }
            vendor:         { type: [string, "null"] }
            display_name:   { type: [string, "null"] }
      # ── TS pool (TimescaleDB: charging_sessions / optimization_runs / …) ──
      sessions:
        type: array
        items:
          type: object
          required: [vehicle_id, depot_id, start_time]
          additionalProperties: false
          properties:
            session_id:        { type: string, format: uuid }
            vehicle_id:        { type: string, description: "Textual id matching agent_views.sessions.vehicle_id (varchar), NOT a UUID." }
            driver_id:         { type: [string, "null"], format: uuid }
            card_id:           { type: [string, "null"], format: uuid }
            station_id:        { type: string }
            depot_id:          { type: string, format: uuid }
            start_time:        { oneOf: [{ type: string }, { type: number }] }
            end_time:          { oneOf: [{ type: string }, { type: number }, { type: "null" }] }
            energy_kwh:        { type: number }
            cost_total:        { type: [number, "null"] }
            cost_total_source: { type: string, enum: ["granular", "fallback_average", "unpriceable", "no_energy", "no_depot", "manual"] }
            source:            { type: string, enum: ["live", "import"] }
      optimization_runs:
        type: array
        items:
          type: object
          required: [depot_id, run_time]
          additionalProperties: false
          properties:
            run_id:         { type: string, format: uuid }
            depot_id:       { type: string, format: uuid }
            run_time:       { oneOf: [{ type: string }, { type: number }] }
            trigger_reason: { type: string }
            horizon_start:  { oneOf: [{ type: string }, { type: number }] }
            horizon_end:    { oneOf: [{ type: string }, { type: number }] }
            solve_time_s:   { type: number }
            peak_demand_kw: { type: number }
            status:         { type: string, enum: ["optimal", "feasible", "degraded", "infeasible", "timeout"] }
            solver_used:    { type: string, enum: ["gurobi", "highs"] }
      alerts:
        type: array
        items:
          type: object
          required: [depot_id, created_at, severity, alert_type]
          additionalProperties: false
          properties:
            alert_id:        { type: string, format: uuid }
            depot_id:        { type: string, format: uuid }
            organization_id: { type: string, format: uuid }
            created_at:      { oneOf: [{ type: string }, { type: number }] }
            severity:        { type: string, enum: ["info", "warning", "critical"], description: "Source column; agent_views.alerts.severity_level is generated 1/2/3 from this." }
            status:          { type: string, enum: ["active", "acknowledged", "resolved"] }
            alert_type:      { type: string }
            title:           { type: string }
            dedup_key:       { type: string }
      electricity_prices:
        type: array
        items:
          type: object
          required: [time, node_id, lmp_price_mwh]
          additionalProperties: false
          properties:
            time:          { oneOf: [{ type: string }, { type: number }] }
            node_id:       { type: string, description: "Bidding zone, e.g. '10YLT-1001A0008Q'. Surfaces as agent_views.prices_hourly.bidding_zone." }
            market_type:   { type: string }
            lmp_price_mwh: { type: number, description: "EUR/MWh. agent_views.prices_hourly returns price_per_kwh = this / 1000." }
      building_load:
        type: array
        items:
          type: object
          required: [time, depot_id, power_kw]
          additionalProperties: false
          properties:
            time:     { oneOf: [{ type: string }, { type: number }] }
            depot_id: { type: string, format: uuid }
            power_kw: { type: number }
            source:   { type: string }
      connector_status:
        type: array
        items:
          type: object
          required: [station_id, depot_id, status, timestamp]
          additionalProperties: false
          properties:
            station_id:   { type: string }
            connector_id: { type: integer }
            depot_id:     { type: string, format: uuid }
            status:       { type: string, description: "OCPP status: Available / Charging / Faulted / Unavailable / …" }
            error_code:   { type: [string, "null"] }
            timestamp:    { oneOf: [{ type: string }, { type: number }] }

  llm_trace:
    type: array
    minItems: 1
    description: |
      Sequence of canned Anthropic responses the FakeAnthropicClient hands
      back, one per `client.messages.create(...)` call. Each entry is one
      model turn: a list of content blocks ending (for the final turn) in a
      `tool_use` block named `emit_final_answer` (the SQL agent's terminator).
      Tool calls the harness must dispatch are `run_select_ts` /
      `run_select_static` (carry a `sql` input), plus the optional explorer
      tools `list_tables` / `describe_table` / `sample_values` /
      `current_time` / `lookup_entity`.
    items:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        stop_reason:
          type: string
          enum: [tool_use, end_turn, max_tokens]
        content:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type:  { type: string, enum: [text, tool_use] }
              text:  { type: string }
              id:    { type: string }
              name:  { type: string }
              input: { type: object }
        usage:
          type: object
          additionalProperties: true

  expected:
    type: object
    additionalProperties: false
    required:
      - status
      - agent_views_used
      - sql_validator_rejected
      - final_answer_must_include
      - final_answer_must_not_include
    properties:
      status:
        type: string
        enum: [success, no_terminator, max_iterations, terminator_failed]
        description: |
          The QAResult.status the turn must end with. Almost always
          `success` (the terminator was called with an answer).
      agent_views_used:
        type: array
        items: { type: string }
        description: |
          The set of agent_views.* function names the turn's run_select_*
          calls referenced (order-insensitive, exact set match). Derived the
          same way the production audit derives it
          (src/api/agent/controller._sql_functions_accessed).
      sql_validator_rejected:
        type: boolean
        description: |
          Whether ANY run_select_* call was rejected by the sql_validator.
          False for every well-formed scenario; set True only when the
          scenario deliberately reproduces a validator-rejection path.
      final_answer_must_include:
        type: array
        items: { type: string }
        description: |
          Case-sensitive substrings that MUST appear in the final answer
          text — derived from the fixture data (the kWh number, the depot
          name, the count, …) so the assertion pins a correct answer.
      final_answer_must_not_include:
        type: array
        items: { type: string }
        description: |
          Case-sensitive substrings that must NOT appear — the operator tone
          gate. Every scenario sets at least ["SELECT", "UUID", "agent_views"]
          so the agent never leaks SQL, raw UUIDs, or internal view names to
          the operator.

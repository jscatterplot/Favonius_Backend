      - type: tool_use
        id: "toolu_10_charger"
        name: get_charger_state
        input:
          charger_id: "ccccccc0-0000-4000-8000-000000001001"
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_10_emit"
        name: emit_decision
        input:
          summary: >-
            3 chargers on CIRC-1 faulted together (CP-1001/2/3).
            BUS-1001..1003 need alternate chargers. Single alert
            covering the upstream breaker — investigate before any
            swap.
          rule_applied: "circuit_fault_dedupe"
          proposed_actions:
            - vehicle_ids:
                - "aaaaaaa0-0000-4000-8000-000000001001"
                - "aaaaaaa0-0000-4000-8000-000000001002"
                - "aaaaaaa0-0000-4000-8000-000000001003"
              circuit_id: "CIRC-1"
              type: "circuit_swap"
              requires_manager: true
              justification: >-
                CP-1001, CP-1002, CP-1003 on CIRC-1 faulted together;
                upstream breaker likely. One alert per circuit per PRD
                §6.3 cascading-fault edge case.
          coverage:
            vehicles_checked: 3
            chargers_checked: 3
            routes_checked: 3


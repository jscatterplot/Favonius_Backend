# Sprint 5 scenario 10 — three chargers on one circuit faulted together.
#
# A breaker on CIRC-1 has tripped, faulting CP-1001, CP-1002 and
# CP-1003 simultaneously. All three were charging BUS-1001..1003. PRD
# §6.3 edge case "cascading faults across multiple chargers on the
# same circuit" applies: the agent emits ONE proposed_action covering
# the circuit, not three.
#
# Carry the affected vehicle ids in the action payload so the manager
# can investigate the upstream breaker once.

id: readiness-10-cascading-charger-faults
description: >
  3 chargers on CIRC-1 faulted at once. Expected: exactly one
  proposed_action with type circuit_swap covering all three vehicles.
severity: blocking
scenario_now: "2026-05-13T05:00:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-00000000d010"
  name: daily_readiness_check
  version: "1.0.0"
  description: Daily readiness check (PRD §6.1).
  prompt: |
    You confirm every vehicle will be ready for its assigned route at
    scheduled departure, and surface anything that won't. De-duplicate
    cascading charger faults onto a single proposal per circuit.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_min: 60
    soc_tolerance_pct: 1.0
    escalation_threshold: 3

# draft_and_wait: proposals are a graduated-tier feature (PRD §9.1).
# At `inform` this workflow is a read-only brief and emits no actions;
# this scenario exercises the post-graduation deduped-proposal path.
permission_tier: draft_and_wait


        id: "toolu_01_emit"
        name: emit_decision
        input:
          summary: "All 4 vehicles checked and on plan for the 07:00 pull-out."
          rule_applied: "all_clear"
          proposed_actions: []
          coverage:
            vehicles_checked: 4
            chargers_checked: 4
            routes_checked: 4


# Sprint 5 scenario 01 — all vehicles healthy, all chargers up.
#
# 4 vehicles at ≥ 95% SoC plugged into available chargers (proxy for
# the PRD §6.1 "18 vehicles, all healthy" case — the harness's default
# tool registry only writes a small set of tables, so we keep the fleet
# size proportionate while exercising the same control flow).
#
# Expected: status=all_clear, coverage matches fleet size, zero proposed
# actions, zero filtered violations.

id: readiness-01-all-clear
description: >
  Four vehicles plugged into healthy chargers, all on plan for the
  morning pull-out. The replayed LLM calls the schedule + vehicle +
  charger read tools once each, then emits an empty proposed_actions
  list with a full coverage summary.
severity: blocking
scenario_now: "2026-05-13T05:00:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-00000000d001"
  name: daily_readiness_check
  version: "1.0.0"
  description: Daily readiness check (PRD §6.1).
  prompt: |
    You confirm every vehicle will be ready for its assigned route at
    scheduled departure, and surface anything that won't.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_min: 60
    soc_tolerance_pct: 1.0
    escalation_threshold: 3

permission_tier: inform


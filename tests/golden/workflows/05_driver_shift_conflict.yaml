# Sprint 5 scenario 05 — driver assigned but shift ends before return.
#
# DRV-501 covers R-501 but the driver's shift_end is 90 minutes before
# the scheduled return. The agent emits a swap_driver proposal flagged
# requires_manager=true so a human picks the replacement.

id: readiness-05-driver-shift-conflict
description: >
  Driver DRV-501 assigned to R-501 with shift_end at 17:00 local but
  the scheduled return is 18:30. Expected: one swap_driver proposal
  requiring manager review.
severity: blocking
scenario_now: "2026-05-13T05:00:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-00000000d005"
  name: daily_readiness_check
  version: "1.0.0"
  description: Daily readiness check (PRD §6.1).
  prompt: |
    You confirm every vehicle will be ready for its assigned route at
    scheduled departure, and surface anything that won't.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_min: 60
    soc_tolerance_pct: 1.0
    escalation_threshold: 3

# draft_and_wait: proposals are a graduated-tier feature (PRD §9.1).
# At `inform` this workflow is a read-only brief and emits no actions;
# this scenario exercises the post-graduation proposal path.
permission_tier: draft_and_wait

graph_snapshot:
  depot:
    depot_id: "11111111-1111-4111-8111-1111111100d5"
    name: "Vilnius depot"
    latitude: 54.6872
    longitude: 25.2797
    max_grid_kw: 800.0
    timezone: "Europe/Vilnius"

  vehicles:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000005d1"
      external_id: "BUS-501"
      vehicle_type: "bus_large"
      battery_kwh: 324.0
      max_charge_kw: 80.0

  chargers:
    - charger_id: "ccccccc0-0000-4000-8000-0000000005d1"
      ocpp_id: "CP-501"
      rated_kw: 80.0
      status: "Available"

  drivers:
    - driver_id: "ddddddd0-0000-4000-8000-0000000005d1"
      external_driver_id: "EMP-5001"
      display_name: "Driver 5001"
      status: "active"

  schedules:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000005d1"
      route_id: "R-501"
      departure_time: "+2h"
      return_time: "+13h"
      energy_kwh: 240.0
      required_soc: 0.85

  telemetry:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000005d1"
      charger_id: "ccccccc0-0000-4000-8000-0000000005d1"
      time: "-5m"
      soc: 0.96
      is_plugged: true
      charging_kw: 60.0

llm_trace:
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_05_sched"
        name: get_scheduled_departures
        input: {}
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_05_emit"
        name: emit_decision
        input:
          summary: >-
            Driver DRV-501 shift ends 90 minutes before R-501 return.
            Recommend swapping in a driver whose shift covers the full
            window.
          rule_applied: "driver_shift_conflict_swap"
          proposed_actions:
            - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000005d1"
              type: "swap_driver"
              route_id: "R-501"
              requires_manager: true
              justification: "DRV-501 shift_end before scheduled R-501 return; needs replacement covering full route."
          coverage:
            vehicles_checked: 1
            chargers_checked: 1
            routes_checked: 1

expected:
  disposition: pending
  rule_applied: driver_shift_conflict_swap
  output:
    summary_contains: "shift"
    proposed_action_types:
      - swap_driver
    proposed_action_count_min: 1
    proposed_action_count_max: 1
    must_propose_for_vehicle:
      - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000005d1"
        action_type_contains: "swap_driver"
    filtered_violations_max: 0
    coverage:
      vehicles_checked: 1
      chargers_checked: 1
      routes_checked: 1
  tool_calls:
    count_min: 1
    names_in_order:
      - get_scheduled_departures
    all_ok: true

# Sprint 5 scenario 08 — vehicle returned 20 minutes late, optimiser recovered.
#
# Last night BUS-801 came back 20 minutes after its scheduled return
# time. The optimiser absorbed the lateness into the overnight charging
# plan and the projected SoC at the next departure still meets the
# required threshold. Expected: no exception (the recovery path covers
# it), summary acknowledges the late return but reports all_clear.

id: readiness-08-late-return
description: >
  Previous shift returned 20 min late; optimiser-adjusted plan already
  recovered. Morning check reports all_clear with no proposed actions.
severity: blocking
scenario_now: "2026-05-13T05:00:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-00000000d008"
  name: daily_readiness_check
  version: "1.0.0"
  description: Daily readiness check (PRD §6.1).
  prompt: |
    You confirm every vehicle will be ready for its assigned route at
    scheduled departure, and surface anything that won't.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_min: 60
    soc_tolerance_pct: 1.0
    escalation_threshold: 3

permission_tier: inform

graph_snapshot:
  depot:
    depot_id: "11111111-1111-4111-8111-1111111100d8"
    name: "Vilnius depot"
    latitude: 54.6872
    longitude: 25.2797
    max_grid_kw: 800.0
    timezone: "Europe/Vilnius"

  vehicles:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000008d1"
      external_id: "BUS-801"
      vehicle_type: "bus_large"
      battery_kwh: 324.0
      max_charge_kw: 80.0

  chargers:
    - charger_id: "ccccccc0-0000-4000-8000-0000000008d1"
      ocpp_id: "CP-801"
      rated_kw: 80.0
      status: "Available"

  schedules:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000008d1"
      route_id: "R-801"
      departure_time: "+2h"
      return_time: "+12h"
      energy_kwh: 240.0
      required_soc: 0.85

  telemetry:
    # Last reading 4 minutes ago — plan absorbed last night's 20-min
    # late return, BUS-801 is now at 0.97 with plenty of headroom.
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000008d1"
      charger_id: "ccccccc0-0000-4000-8000-0000000008d1"
      time: "-4m"
      soc: 0.97
      is_plugged: true
      charging_kw: 60.0

llm_trace:
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_08_sched"
        name: get_scheduled_departures
        input: {}
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_08_veh"
        name: get_vehicle_state
        input:
          vehicle_id: "aaaaaaa0-0000-4000-8000-0000000008d1"
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_08_emit"
        name: emit_decision
        input:
          summary: >-
            BUS-801 returned 20 minutes late last shift; optimiser-adjusted
            plan recovered to 97% SoC. On plan for the 07:00 pull-out.
          rule_applied: "late_return_recovered"
          proposed_actions: []
          coverage:
            vehicles_checked: 1
            chargers_checked: 1
            routes_checked: 1

expected:
  disposition: pending
  rule_applied: late_return_recovered
  output:
    summary_contains: "97%"
    proposed_action_count_max: 0
    filtered_violations_max: 0
    coverage:
      vehicles_checked: 1
      chargers_checked: 1
      routes_checked: 1
  tool_calls:
    count_min: 2
    names_in_order:
      - get_scheduled_departures
      - get_vehicle_state
    all_ok: true

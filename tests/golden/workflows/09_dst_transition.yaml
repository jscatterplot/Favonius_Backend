# Sprint 5 scenario 09 — schedule straddles the spring-forward DST boundary.
#
# Europe/Vilnius springs forward from EET (UTC+02:00) to EEST (UTC+03:00)
# at 03:00 local on the last Sunday of March. In 2026 that boundary is
# 2026-03-29T01:00:00Z. The departure scheduled for +2h after our
# scenario_now (set 30 minutes after the jump) must be interpreted with
# the post-DST offset, not the pre-DST one.
#
# The harness resolves time fields via _resolve_time, which honours the
# scenario_now timezone-aware datetime. Expected: the snapshot loads
# cleanly and the agent reports all_clear — proving the time math
# survives the boundary.

id: readiness-09-dst-transition
description: >
  Departure +2h after a scenario_now placed 30 minutes after Europe/
  Vilnius spring-forward. All times resolve with the post-DST offset;
  the run completes all_clear with no exceptions.
severity: blocking
scenario_now: "2026-03-29T01:30:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-00000000d009"
  name: daily_readiness_check
  version: "1.0.0"
  description: Daily readiness check (PRD §6.1).
  prompt: |
    You confirm every vehicle will be ready for its assigned route at
    scheduled departure, and surface anything that won't.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_min: 60
    soc_tolerance_pct: 1.0
    escalation_threshold: 3

permission_tier: inform

graph_snapshot:
  depot:
    depot_id: "11111111-1111-4111-8111-1111111100d9"
    name: "Vilnius depot"
    latitude: 54.6872
    longitude: 25.2797
    max_grid_kw: 800.0
    timezone: "Europe/Vilnius"

  vehicles:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000009d1"
      external_id: "BUS-901"
      vehicle_type: "bus_large"
      battery_kwh: 324.0
      max_charge_kw: 80.0

  chargers:
    - charger_id: "ccccccc0-0000-4000-8000-0000000009d1"
      ocpp_id: "CP-901"
      rated_kw: 80.0
      status: "Available"

  schedules:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000009d1"
      route_id: "R-901"
      departure_time: "+2h"
      return_time: "+12h"
      energy_kwh: 240.0
      required_soc: 0.85

  telemetry:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000009d1"
      charger_id: "ccccccc0-0000-4000-8000-0000000009d1"
      time: "-5m"
      soc: 0.96
      is_plugged: true
      charging_kw: 60.0

llm_trace:
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_09_sched"
        name: get_scheduled_departures
        input: {}
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_09_emit"
        name: emit_decision
        input:
          summary: >-
            BUS-901 ready for the post-DST 06:30 EEST pull-out. Window
            renders with the +03:00 offset.
          rule_applied: "all_clear"
          proposed_actions: []
          coverage:
            vehicles_checked: 1
            chargers_checked: 1
            routes_checked: 1

expected:
  disposition: pending
  rule_applied: all_clear
  output:
    summary_contains: "EEST"
    proposed_action_count_max: 0
    filtered_violations_max: 0
    coverage:
      vehicles_checked: 1
      chargers_checked: 1
      routes_checked: 1
  tool_calls:
    count_min: 1
    names_in_order:
      - get_scheduled_departures
    all_ok: true

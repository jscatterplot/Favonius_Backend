# Sprint 5 scenario 06 — vehicle telemetry is 90 minutes stale.
#
# PRD §6.1 edge case: telemetry over 15 minutes old gates any
# mitigation. The agent surfaces the stale data via emit_decision but
# emits NO proposed_actions — the depot manager investigates the
# telemetry integration first. The `data_freshness` evidence lives in
# the summary; the assertion is proposed_action_count_max=0 (no action)
# combined with summary_contains: "stale" and rule_applied tag.

id: readiness-06-stale-telemetry
description: >
  BUS-601 telemetry last seen 90 minutes ago (threshold 15). Expected:
  zero proposed actions, summary calls out the staleness, rule_applied
  is data_freshness_block.
severity: blocking
scenario_now: "2026-05-13T05:00:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-00000000d006"
  name: daily_readiness_check
  version: "1.0.0"
  description: Daily readiness check (PRD §6.1).
  prompt: |
    You confirm every vehicle will be ready for its assigned route at
    scheduled departure, and surface anything that won't.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_min: 60
    soc_tolerance_pct: 1.0
    escalation_threshold: 3

permission_tier: inform

graph_snapshot:
  depot:
    depot_id: "11111111-1111-4111-8111-1111111100d6"
    name: "Vilnius depot"
    latitude: 54.6872
    longitude: 25.2797
    max_grid_kw: 800.0
    timezone: "Europe/Vilnius"

  vehicles:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000006d1"
      external_id: "BUS-601"
      vehicle_type: "bus_large"
      battery_kwh: 324.0
      max_charge_kw: 80.0

  chargers:
    - charger_id: "ccccccc0-0000-4000-8000-0000000006d1"
      ocpp_id: "CP-601"
      rated_kw: 80.0
      status: "Available"

  schedules:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000006d1"
      route_id: "R-601"
      departure_time: "+2h"
      return_time: "+12h"
      energy_kwh: 240.0
      required_soc: 0.85

  telemetry:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000006d1"
      charger_id: "ccccccc0-0000-4000-8000-0000000006d1"
      time: "-90m"
      soc: 0.80
      is_plugged: true
      charging_kw: 0.0

llm_trace:
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_06_sched"
        name: get_scheduled_departures
        input: {}
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_06_veh"
        name: get_vehicle_state
        input:
          vehicle_id: "aaaaaaa0-0000-4000-8000-0000000006d1"
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_06_emit"
        name: emit_decision
        input:
          summary: >-
            BUS-601 telemetry is stale (last seen 90 minutes ago vs
            15-minute threshold). Cannot verify readiness — requires
            manager review of the telemetry integration before any
            mitigation is proposed.
          rule_applied: "data_freshness_block"
          proposed_actions: []
          coverage:
            vehicles_checked: 1
            chargers_checked: 1
            routes_checked: 1

expected:
  disposition: pending
  rule_applied: data_freshness_block
  output:
    summary_contains: "stale"
    proposed_action_count_max: 0
    filtered_violations_max: 0
    coverage:
      vehicles_checked: 1
      chargers_checked: 1
      routes_checked: 1
  tool_calls:
    count_min: 2
    names_in_order:
      - get_scheduled_departures
      - get_vehicle_state
    all_ok: true

# Example scenario — all vehicles healthy, all chargers available.
#
# Proves the harness threads a clean turn through Sprint 2's runtime
# end-to-end against the real DB schema and surfaces an empty
# proposed_actions list. Mirrors the first scenario sketched in PRD
# §6.1 ("All vehicles healthy, all chargers healthy → expect
# all_clear").
#
# Under _examples/ so it does NOT block the workflow-golden gate. The
# real readiness scenarios land directly under tests/golden/workflows/
# in sprint 5.

id: readiness-all-clear
description: >
  Two vehicles, both plugged into available chargers at ≥ 95% SoC,
  scheduled to depart in two hours. The replayed LLM calls one read
  tool, then emits an empty proposed_actions list with a coverage
  summary.
severity: blocking
scenario_now: "2026-05-13T05:00:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-000000000001"
  name: readiness_check
  version: "v1"
  description: Daily readiness brief — sprint-5 stub for harness wiring.
  prompt: |
    You confirm every vehicle will be ready for its assigned route
    at scheduled departure, and surface anything that won't be.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_minutes: 60

permission_tier: draft_and_wait

graph_snapshot:
  depot:
    depot_id: "11111111-1111-4111-8111-111111111111"
    name: "Vilnius depot"
    latitude: 54.6872
    longitude: 25.2797
    max_grid_kw: 800.0
    timezone: "Europe/Vilnius"

  vehicles:
    - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000001"
      external_id: "BUS-101"
      vehicle_type: "bus_large"
      battery_kwh: 324.0
      max_charge_kw: 80.0
    - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000002"
      external_id: "BUS-102"
      vehicle_type: "bus_large"
      battery_kwh: 324.0
      max_charge_kw: 80.0

  chargers:
    - charger_id: "cccccc01-0000-4000-8000-000000000001"
      ocpp_id: "CP-001"
      rated_kw: 80.0
      status: "Available"
    - charger_id: "cccccc01-0000-4000-8000-000000000002"
      ocpp_id: "CP-002"
      rated_kw: 80.0
      status: "Available"

  schedules:
    - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000001"
      route_id: "R-101"
      departure_time: "+2h"
      return_time: "+10h"
      energy_kwh: 240.0
      required_soc: 0.85
    - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000002"
      route_id: "R-102"
      departure_time: "+2h"
      return_time: "+10h"
      energy_kwh: 240.0
      required_soc: 0.85

  telemetry:
    - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000001"
      charger_id: "cccccc01-0000-4000-8000-000000000001"
      time: "-5m"
      soc: 0.95
      is_plugged: true
      charging_kw: 60.0
    - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000002"
      charger_id: "cccccc01-0000-4000-8000-000000000002"
      time: "-5m"
      soc: 0.96
      is_plugged: true
      charging_kw: 60.0

llm_trace:
  # Turn 1 — read the schedules.
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_t1_sched"
        name: get_scheduled_departures
        input: {}
  # Turn 2 — emit the decision with no proposed actions.
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_t2_emit"
        name: emit_decision
        input:
          summary: "All 2 vehicles checked and on plan for the 07:00 pull-out."
          proposed_actions: []
          coverage:
            vehicles_checked: 2
            chargers_checked: 2
            routes_checked: 2

expected:
  disposition: pending
  output:
    summary_contains: "All 2 vehicles"
    proposed_action_count_max: 0
    filtered_violations_max: 0
    coverage:
      vehicles_checked: 2
      chargers_checked: 2
      routes_checked: 2
    must_not_propose_for_vehicle:
      - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000001"
      - vehicle_id: "aaaaaaa1-0000-4000-8000-000000000002"
  tool_calls:
    count_min: 1
    names_in_order:
      - get_scheduled_departures
    all_ok: true

# Sprint 5 scenario 02 — one vehicle projected to depart undercharged.
#
# BUS-201 sits at 55% with a 71% projection vs an 85% required for its
# 07:00 departure. The agent emits an `extend_charging` proposal that
# holds the current charger and pushes the expected_departure_soc up
# to the required level — well above the 0.99 × 0.85 = 0.8415 hard
# floor. Nothing should be filtered.

id: readiness-02-one-undercharge
description: >
  One vehicle on track to be 71% by 06:30 departure (required 85%).
  Expected: exactly one extend_charging proposal targeting BUS-201,
  no constraint violations filtered.
severity: blocking
scenario_now: "2026-05-13T05:00:00+00:00"

workflow:
  id: "10000000-0000-4000-8000-00000000d002"
  name: daily_readiness_check
  version: "1.0.0"
  description: Daily readiness check (PRD §6.1).
  prompt: |
    You confirm every vehicle will be ready for its assigned route at
    scheduled departure, and surface anything that won't.
  allowed_tools:
    - get_scheduled_departures
    - get_vehicle_state
    - get_charger_state
  parameters:
    lead_time_min: 60
    soc_tolerance_pct: 1.0
    escalation_threshold: 3

permission_tier: inform

graph_snapshot:
  depot:
    depot_id: "11111111-1111-4111-8111-1111111100d2"
    name: "Vilnius depot"
    latitude: 54.6872
    longitude: 25.2797
    max_grid_kw: 800.0
    timezone: "Europe/Vilnius"

  vehicles:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000002d1"
      external_id: "BUS-201"
      vehicle_type: "bus_large"
      battery_kwh: 324.0
      max_charge_kw: 80.0

  chargers:
    - charger_id: "ccccccc0-0000-4000-8000-0000000002d1"
      ocpp_id: "CP-201"
      rated_kw: 80.0
      status: "Available"

  schedules:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000002d1"
      route_id: "R-201"
      departure_time: "+90m"
      return_time: "+12h"
      energy_kwh: 260.0
      required_soc: 0.85

  telemetry:
    - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000002d1"
      charger_id: "ccccccc0-0000-4000-8000-0000000002d1"
      time: "-5m"
      soc: 0.55
      is_plugged: true
      charging_kw: 60.0

llm_trace:
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_02_sched"
        name: get_scheduled_departures
        input: {}
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_02_veh"
        name: get_vehicle_state
        input:
          vehicle_id: "aaaaaaa0-0000-4000-8000-0000000002d1"
  - stop_reason: tool_use
    content:
      - type: tool_use
        id: "toolu_02_emit"
        name: emit_decision
        input:
          summary: >-
            BUS-201 projected 71% SoC vs 85% required at 06:30. Recommend
            extending charging on CP-201 to reach the target.
          rule_applied: "undercharge_extend"
          proposed_actions:
            - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000002d1"
              type: "extend_charging"
              charger_id: "ccccccc0-0000-4000-8000-0000000002d1"
              expected_departure_soc: 0.85
              justification: "Hold on CP-201 until projected SoC >= 0.85."
          coverage:
            vehicles_checked: 1
            chargers_checked: 1
            routes_checked: 1

expected:
  disposition: pending
  rule_applied: undercharge_extend
  output:
    summary_contains: "BUS-201"
    proposed_action_types:
      - extend_charging
    proposed_action_count_min: 1
    proposed_action_count_max: 1
    must_propose_for_vehicle:
      - vehicle_id: "aaaaaaa0-0000-4000-8000-0000000002d1"
        action_type_contains: "extend"
    filtered_violations_max: 0
    coverage:
      vehicles_checked: 1
      chargers_checked: 1
      routes_checked: 1
  tool_calls:
    count_min: 2
    names_in_order:
      - get_scheduled_departures
      - get_vehicle_state
    all_ok: true

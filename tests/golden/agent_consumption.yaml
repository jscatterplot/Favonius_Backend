# ── Edge cases ────────────────────────────────────────────────────────────────

- id: edge-01
  message: "Show me last month's charging for John Smith."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: John Smith
  expected_status: success
  expected_row_count: 0
  # John Smith exists but all sessions have NULL driver_id (card-only); row count 0

- id: edge-02
  message: "How much did Jane Doe charge last month?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Jane Doe
  expected_status: success
  # Sessions span the month boundary; query must include both sides

- id: edge-03
  message: "Show me yesterday's consumption for Maria Petrauskas."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Maria Petrauskas
  expected_status: success
  # DST spring-forward Sunday; UTC bounds shift, Lithuanian TZ

- id: edge-04
  message: "How much did Lukas charge last week?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Lukas
  expected_status: success
  # DST fall-back weekend; week boundary in depot local time

- id: edge-05
  message: "Show consumption for EMP-2000 last month."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: EMP-2000
  expected_status: success
  expected_row_count: 0
  # Known driver with zero charging sessions in the period

- id: edge-06
  message: "How much did Anna Nowak charge yesterday?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Anna Nowak
  expected_status: success
  expected_row_count: 1
  # Exactly one session yesterday

- id: edge-07
  message: "What did John Smith charge last month?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: John Smith
  expected_status: success
  # January — "last month" resolves to December of the previous year

- id: edge-08
  message: "How much did I charge today?"
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: success
  expected_row_count: 0
  # "Today" with no sessions yet; result is empty but status is success

- id: edge-09
  message: "Show me yesterday's usage for Jonas Brazauskas."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Jonas Brazauskas
  expected_status: success
  expected_row_count: 1
  # Single session exactly matching yesterday

- id: edge-10
  message: >
    Show Jonas Brazauskas consumption from 2025-11-01 to 2026-02-28.
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Jonas Brazauskas
  expected_status: success
  # Multi-month absolute window crossing year boundary

- id: edge-11
  message: "How much did Peter Kessler charge last month?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Peter Kessler
  expected_status: success
  # Peter Kessler has three RFID cards; all should be included

- id: edge-12
  message: "Show midnight sessions for EMP-1042 last month."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: EMP-1042
  expected_status: success
  # Sessions starting at exactly 00:00:00 UTC — time-zone truncation edge

- id: edge-13
  message: >
    How much did Anna Nowak charge from 2024-02-28 to 2024-03-01?
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Anna Nowak
  expected_status: success
  # Leap day (2024 is a leap year); absolute window straddles it

- id: edge-14
  message: "How much did EMP-1042 charge at the Kaunas depot last month?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: EMP-1042
    - kind: depot
      text: Kaunas
  expected_status: success
  # Driver assigned to multiple depots; filter to Kaunas only

- id: edge-15
  message: "Show me last week's consumption for O'Brien."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: "O'Brien"
  expected_status: success
  # Apostrophe in name; SQL parameter escaping must handle it

- id: edge-16
  message: "How much power did the Renault vans consume last night?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: vehicle
      text: "renault van"
  expected_status: success
  # Vehicle fleet (make/type) — expands to every matching vehicle and sums

- id: edge-17
  message: "How much power was consumed last month?"
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: success
  # Depot-wide total — no named subject; extraction sets depot_wide=true

# ── Refusals ─────────────────────────────────────────────────────────────────

- id: ref-01
  message: "Schedule John for a charge tomorrow morning."
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: refused
  # Write intent — agent must return empty subjects

- id: ref-02
  message: "How much did John charge last month AND list all his sessions?"
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: refused
  # Multi-intent — agent must refuse

- id: ref-03
  message: "Kiek Jonui buvo priskaičiuota praėjusį mėnesį?"
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: refused
  # Lithuanian — agent is English-only at v0

- id: ref-04
  message: "What's the current state of charge of bus 42?"
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: refused
  # Out-of-scope intent (vehicle SoC, not consumption)

- id: ref-05
  message: "Should I charge the fleet tomorrow at 3 AM based on tomorrow's tariffs?"
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: refused
  # Forecasting / recommendation — out of scope

# Golden test suite for the depot chat agent — consumption_by_user intent.
#
# 52 Q&A pairs covering:
#   hp-*   Happy paths (10)
#   amb-*  Ambiguity (10)
#   nf-*   Not found (10)
#   edge-* Edge cases (17) — includes vehicle/fleet + depot-wide totals
#   ref-*  Refusals (5)
#
# Each entry:
#   id                  — unique slug
#   message             — raw user message sent to the agent
#   expected_intent     — the QueryPlan intent the LLM should extract
#   expected_subjects   — list of {kind, text} the plan should contain
#   expected_status     — success | disambiguation | not_found | refused
#   expected_row_count  — (optional) exact row count for seeded fixtures
#
# "refused" maps to expected_subjects: [] in the extracted plan.
# The runner asserts the plan subjects list is empty for refusals.
# expected_row_count is only asserted when the key is present (non-null).
#
# PRD §7 correctness target: ≥ 95% (≥ 48/50 entries must pass).

# ── Happy paths ───────────────────────────────────────────────────────────────

- id: hp-01
  message: "How much did John charge last month?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: John
  expected_status: success

- id: hp-02
  message: "Show me electricity consumption for Jane Doe in April 2026."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Jane Doe
  expected_status: success

- id: hp-03
  message: "What was the total energy usage for both John Smith and Maria Petrauskas last week?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: John Smith
    - kind: driver
      text: Maria Petrauskas
  expected_status: success

- id: hp-04
  message: >
    Show consumption for drivers EMP-1042 and EMP-1158 from 2026-04-01 to
    2026-04-30, grouped by day.
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: EMP-1042
    - kind: driver
      text: EMP-1158
  expected_status: success

- id: hp-05
  message: "How much electricity did the Vilnius depot drivers consume this month?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: depot
      text: Vilnius
  expected_status: success

- id: hp-06
  message: "Show me last month's consumption for all depots."
  expected_intent: consumption_by_user
  expected_subjects: []
  expected_status: success

- id: hp-07
  message: "What did Lukas Jankauskas charge last month?"
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Lukas Jankauskas
  expected_status: success

- id: hp-08
  message: "Show consumption for employee EMP-0999 this week."
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: EMP-0999
  expected_status: success

- id: hp-09
  message: >
    How much electricity did Jonas Brazauskas use at the Kaunas depot last month?
  expected_intent: consumption_by_user
  expected_subjects:
    - kind: driver
      text: Jonas Brazauskas
    - kind: depot
      text: Kaunas
  expected_status: success

- id: hp-10
  message: >
    Give me consumption for Anna Nowak from 2026-03-01 to 2026-03-31,

# Agent-SQL golden scenarios (PLAN.md session S2) — 20 questions.
#
# Validated against tests/golden/agent_sql/_schema.yaml and replayed through the
# real run_qa_turn loop + sql_validator + sql_executor against the agent_views.*
# functions over each scenario's graph_snapshot (loaded into a rolled-back
# savepoint on a real TimescaleDB + Supabase pair). See the harness in
# tests/golden/test_agent_sql_golden.py.
#
# Conventions shared across scenarios (DRY — one universe, not 20):
#   * Depots: Vilnius (1111…) and Kaunas (2222…), declared once as YAML anchors
#     (&dep_vil / &dep_kau) and referenced elsewhere (*dep_vil / *dep_kau).
#   * Driver John Smith (d0000001…) at Vilnius. Vehicles are the textual session
#     ids bus_NNN (agent_views.sessions.vehicle_id is varchar).
#   * No `auth:` block — the harness defaults the org and derives
#     visible_depot_ids (the $1 bind) from graph_snapshot.depots.
#   * Name resolution goes through agent_views.depots/drivers (run_select_static),
#     never raw UUIDs in the answer (the tone gate forbids "UUID").
#
# SQL authoring rules (enforced at run time): FROM agent_views.<fn>($1) only;
# $1 is the sole placeholder; absolute literal time bounds (reproducible);
# hypertable functions (prices_hourly) carry a bounding predicate on `hour`.
# Column names/units: src/api/agent/catalogue.py. Ground truth:
# migrations/042_agent_views_ts.sql + migrations/supabase/040_agent_views_static.sql.

# ════════════════════════ energy + cost rollups (7) ════════════════════════

- id: en_01
  category: energy_cost
  question: "How much energy did vehicle bus_101 consume last month?"
  description: >
    SUM(energy_kwh) for one vehicle over April 2026 ("last month" vs
    scenario_now 2026-05-25). A March session and a different vehicle are decoys
    that confirm the month bound and the vehicle filter both apply.
  scenario_now: "2026-05-25T12:00:00Z"
  graph_snapshot:
    depots:
      - &dep_vil
        depot_id: "11111111-1111-4111-8111-111111111111"
        name: "Vilnius"
        entsoe_zone: "10YLT-1001A0008Q"
    sessions:
      - { vehicle_id: "bus_101", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-04-10T08:00:00Z", energy_kwh: 120.5 }
      - { vehicle_id: "bus_101", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-04-20T08:00:00Z", energy_kwh: 200.0 }
      - { vehicle_id: "bus_101", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-03-15T08:00:00Z", energy_kwh: 90.0 }
      - { vehicle_id: "bus_202", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-04-12T08:00:00Z", energy_kwh: 150.0 }
  llm_trace:
    - content:
        - type: tool_use
          id: "en01_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT COUNT(*) AS n_sessions, SUM(energy_kwh) AS total_kwh
              FROM agent_views.sessions($1)
              WHERE vehicle_id = 'bus_101'
                AND start_time >= '2026-04-01' AND start_time < '2026-05-01'
    - content:
        - type: tool_use
          id: "en01_a"
          name: emit_final_answer
          input: { text: "Bus_101 consumed 320.5 kWh across 2 sessions in April 2026.", row_evidence: 1 }
  expected:
    status: success
    agent_views_used: ["sessions"]
    sql_validator_rejected: false
    final_answer_must_include: ["320.5 kWh", "2 sessions"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]

- id: en_02
  category: energy_cost
  question: "What was the total electricity cost at depot Vilnius last week?"
  description: >
    Resolve "Vilnius" to its id via agent_views.depots, then SUM(cost_total)
    over last week (2026-05-18..2026-05-25), excluding unpriceable sessions. A
    Kaunas session and an unpriceable Vilnius session are decoys.
  scenario_now: "2026-05-25T12:00:00Z"
  graph_snapshot:
    depots:
      - *dep_vil
      - &dep_kau
        depot_id: "22222222-2222-4222-8222-222222222222"
        name: "Kaunas"
        entsoe_zone: "10YLT-1001A0008Q"
    sessions:
      - { vehicle_id: "bus_101", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-19T08:00:00Z", energy_kwh: 220.0, cost_total: 60.00, cost_total_source: "granular" }
      - { vehicle_id: "bus_102", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-20T08:00:00Z", energy_kwh: 150.0, cost_total: 45.50, cost_total_source: "granular" }
      - { vehicle_id: "bus_103", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-21T08:00:00Z", energy_kwh: 100.0, cost_total: null, cost_total_source: "unpriceable" }
      - { vehicle_id: "bus_201", depot_id: "22222222-2222-4222-8222-222222222222", start_time: "2026-05-19T08:00:00Z", energy_kwh: 300.0, cost_total: 100.00, cost_total_source: "granular" }
  llm_trace:
    - content:
        - type: tool_use
          id: "en02_resolve"
          name: run_select_static
          input:
            sql: "SELECT depot_id FROM agent_views.depots($1) WHERE name ILIKE 'Vilnius'"
    - content:
        - type: tool_use
          id: "en02_sum"
          name: run_select_ts
          input:
            sql: >-
              SELECT SUM(cost_total) AS total_cost FROM agent_views.sessions($1)
              WHERE depot_id = '11111111-1111-4111-8111-111111111111'
                AND start_time >= '2026-05-18' AND start_time < '2026-05-25'
                AND cost_total_source <> 'unpriceable'
    - content:
        - type: tool_use
          id: "en02_a"
          name: emit_final_answer
          input: { text: "Depot Vilnius spent 105.50 EUR on electricity last week.", row_evidence: 1 }
  expected:
    status: success
    agent_views_used: ["depots", "sessions"]
    sql_validator_rejected: false
    final_answer_must_include: ["105.50", "Vilnius"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]

- id: en_03
  category: energy_cost
  question: "Which depot had the highest energy consumption in April 2026?"
  description: >
    GROUP BY depot_id, ORDER BY SUM(energy_kwh) DESC LIMIT 1 (TS), then resolve
    the winning depot_id to a name via agent_views.depots (static). Kaunas (350)
    beats Vilnius (220) so the winner is not just the first depot.
  scenario_now: "2026-05-25T12:00:00Z"
  graph_snapshot:
    depots:
      - *dep_vil
      - *dep_kau
    sessions:
      - { vehicle_id: "bus_101", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-04-05T08:00:00Z", energy_kwh: 100.0 }
      - { vehicle_id: "bus_102", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-04-06T08:00:00Z", energy_kwh: 120.0 }
      - { vehicle_id: "bus_201", depot_id: "22222222-2222-4222-8222-222222222222", start_time: "2026-04-05T08:00:00Z", energy_kwh: 300.0 }
      - { vehicle_id: "bus_202", depot_id: "22222222-2222-4222-8222-222222222222", start_time: "2026-04-06T08:00:00Z", energy_kwh: 50.0 }
  llm_trace:
    - content:
        - type: tool_use
          id: "en03_rank"
          name: run_select_ts
          input:
            sql: >-
              SELECT depot_id, SUM(energy_kwh) AS total_kwh FROM agent_views.sessions($1)
              WHERE start_time >= '2026-04-01' AND start_time < '2026-05-01'
              GROUP BY depot_id ORDER BY total_kwh DESC LIMIT 1
    - content:
        - type: tool_use
          id: "en03_name"
          name: run_select_static
          input:
            sql: "SELECT name FROM agent_views.depots($1) WHERE depot_id = '22222222-2222-4222-8222-222222222222'"
    - content:
        - type: tool_use
          id: "en03_a"
          name: emit_final_answer
          input: { text: "Kaunas had the highest energy consumption in April 2026, at 350 kWh.", row_evidence: 1 }
  expected:
    status: success
    agent_views_used: ["sessions", "depots"]
    sql_validator_rejected: false
    final_answer_must_include: ["Kaunas", "350 kWh"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]


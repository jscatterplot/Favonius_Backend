      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-22T01:00:00Z", status: "optimal", trigger_reason: "scheduled" }
      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-10T01:00:00Z", status: "infeasible", trigger_reason: "scheduled" }
  llm_trace:
    - content:
        - type: tool_use
          id: "ops09_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT COUNT(*) AS n FROM agent_views.optimization_runs($1)
              WHERE status = 'infeasible'
                AND run_time >= '2026-05-18' AND run_time < '2026-05-25'
    - content:
        - type: tool_use
          id: "ops09_a"
          name: emit_final_answer
          input: { text: "2 optimization runs went infeasible last week.", row_evidence: 1 }
  expected:
    status: success
    agent_views_used: ["optimization_runs"]
    sql_validator_rejected: false
    final_answer_must_include: ["2 optimization runs", "infeasible"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]

- id: ops_10
  category: ops_status
  question: "What triggered the last 5 reoptimizations at depot Vilnius?"
  description: >
    SELECT trigger_reason, run_time ORDER BY run_time DESC LIMIT 5. trigger_reason
    is free-form (catalogue): literals like 'scheduled'/'hourly' and prefixes
    like 'Price change: …'/'SoC deviation: …'/'Return delay: …'. The oldest of
    six runs is dropped by the LIMIT.
  scenario_now: "2026-05-25T12:00:00Z"
  graph_snapshot:
    depots:
      - *dep_vil
    optimization_runs:
      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-24T10:00:00Z", trigger_reason: "Price change: +30%" }
      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-24T09:00:00Z", trigger_reason: "scheduled" }
      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-24T08:00:00Z", trigger_reason: "SoC deviation: bus_101" }
      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-24T07:00:00Z", trigger_reason: "hourly" }
      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-24T06:00:00Z", trigger_reason: "Return delay: bus_202" }
      - { depot_id: "11111111-1111-4111-8111-111111111111", run_time: "2026-05-24T05:00:00Z", trigger_reason: "scheduled" }
  llm_trace:
    - content:
        - type: tool_use
          id: "ops10_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT trigger_reason, run_time FROM agent_views.optimization_runs($1)
              ORDER BY run_time DESC LIMIT 5
    - content:
        - type: tool_use
          id: "ops10_a"

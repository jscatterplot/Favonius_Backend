      - { vehicle_id: "bus_202", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-03T08:00:00Z", energy_kwh: 250.0, cost_total: 250.00 }
      - { vehicle_id: "bus_303", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-04T08:00:00Z", energy_kwh: 200.0, cost_total: 200.00 }
      - { vehicle_id: "bus_404", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-05T08:00:00Z", energy_kwh: 150.0, cost_total: 150.00 }
      - { vehicle_id: "bus_505", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-06T08:00:00Z", energy_kwh: 100.0, cost_total: 100.00 }
      - { vehicle_id: "bus_606", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-07T08:00:00Z", energy_kwh: 50.0, cost_total: 50.00 }

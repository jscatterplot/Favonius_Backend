# ════════════════════════ operations status (7) ════════════════════════════

- id: ops_08
  category: ops_status
  question: "Which chargers were faulted yesterday?"
  description: >
    Names the chargers currently Faulted whose status flipped yesterday
    (2026-05-24). Uses connector_status_latest, not alerts: the alerts view
    exposes no station/charger id, so it cannot answer "which chargers". CP-01
    also has an earlier Available row to exercise the view's latest-row-per-
    (station,connector) DISTINCT ON.
  scenario_now: "2026-05-25T12:00:00Z"
  graph_snapshot:
    depots:
      - *dep_vil
    connector_status:
      - { station_id: "CP-01", connector_id: 1, depot_id: "11111111-1111-4111-8111-111111111111", status: "Available", timestamp: "2026-05-20T08:00:00Z" }
      - { station_id: "CP-01", connector_id: 1, depot_id: "11111111-1111-4111-8111-111111111111", status: "Faulted", error_code: "GroundFailure", timestamp: "2026-05-24T14:00:00Z" }
      - { station_id: "CP-02", connector_id: 1, depot_id: "11111111-1111-4111-8111-111111111111", status: "Faulted", error_code: "OverCurrentFailure", timestamp: "2026-05-24T16:00:00Z" }
      - { station_id: "CP-03", connector_id: 1, depot_id: "11111111-1111-4111-8111-111111111111", status: "Available", timestamp: "2026-05-24T10:00:00Z" }
  llm_trace:
    - content:
        - type: tool_use
          id: "ops08_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT station_id FROM agent_views.connector_status_latest($1)
              WHERE status = 'Faulted'
                AND last_changed_at >= '2026-05-24' AND last_changed_at < '2026-05-25'
              ORDER BY station_id
    - content:
        - type: tool_use
          id: "ops08_a"
          name: emit_final_answer
          input: { text: "Two chargers were faulted yesterday: CP-01 and CP-02.", row_evidence: 2 }
  expected:
    status: success
    agent_views_used: ["connector_status_latest"]
    sql_validator_rejected: false
    final_answer_must_include: ["CP-01", "CP-02"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]


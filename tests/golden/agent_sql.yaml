- id: en_06
  category: energy_cost
  question: "What's the average energy per charging session at depot Vilnius this month?"
  description: >
    AVG(energy_kwh) over May 2026, depot-scoped (visible depots = {Vilnius}, so
    sessions($1) is already Vilnius-only). An April session is excluded by the
    month bound; three May sessions average to 150 kWh.
  scenario_now: "2026-05-25T12:00:00Z"
  graph_snapshot:
    depots:
      - *dep_vil
    sessions:
      - { vehicle_id: "bus_101", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-04T08:00:00Z", energy_kwh: 100.0 }
      - { vehicle_id: "bus_102", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-05T08:00:00Z", energy_kwh: 150.0 }
      - { vehicle_id: "bus_103", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-05-06T08:00:00Z", energy_kwh: 200.0 }
      - { vehicle_id: "bus_104", depot_id: "11111111-1111-4111-8111-111111111111", start_time: "2026-04-30T08:00:00Z", energy_kwh: 999.0 }
  llm_trace:
    - content:
        - type: tool_use
          id: "en06_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT AVG(energy_kwh) AS avg_kwh, COUNT(*) AS n FROM agent_views.sessions($1)
              WHERE start_time >= '2026-05-01' AND start_time < '2026-06-01'
    - content:
        - type: tool_use
          id: "en06_a"
          name: emit_final_answer
          input: { text: "Sessions at Vilnius averaged 150 kWh each this month, across 3 sessions.", row_evidence: 1 }
  expected:
    status: success
    agent_views_used: ["sessions"]
    sql_validator_rejected: false
    final_answer_must_include: ["150 kWh", "Vilnius"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]


# Agent-SQL golden scenarios (PLAN.md session S2).
#
# Validated against tests/golden/agent_sql/_schema.yaml by the harness in
# tests/golden/test_agent_sql_golden.py. Each scenario replays a hand-written
# llm_trace through the real run_qa_turn loop + sql_validator + sql_executor
# against the agent_views.* functions over the graph_snapshot fixtures.
#
# SQL authoring rules (enforced at run time by the real validator/executor):
#   * FROM agent_views.<fn>($1) only — never a base table.
#   * $1 is the only placeholder (server binds it to the caller's depots).
#   * Absolute literal time bounds (not now()) so results are reproducible.
# Column names/units are the catalogue's (src/api/agent/catalogue.py); ground
# truth is migrations/042_agent_views_ts.sql + migrations/supabase/040_agent_views_static.sql.

# ── energy + cost rollups ────────────────────────────────────────────────────

- id: en_01
  category: energy_cost
  question: "How much energy did vehicle bus_101 consume last month?"
  description: >
    SUM(energy_kwh) for one vehicle over April 2026. Decoy rows (a different
    vehicle, and a March session) confirm the vehicle filter and the month
    bound both apply. "last month" relative to scenario_now 2026-05-25.
  scenario_now: "2026-05-25T12:00:00Z"
  auth:
    organization_id: "bb000000-0000-4000-8000-0000000000bb"
  graph_snapshot:
    depots:
      - depot_id: "11111111-1111-4111-8111-111111111111"
        name: "Vilnius"
        entsoe_zone: "10YLT-1001A0008Q"
    sessions:
      - vehicle_id: "bus_101"      # April — counts
        depot_id: "11111111-1111-4111-8111-111111111111"
        start_time: "2026-04-10T08:00:00Z"
        end_time: "2026-04-10T10:00:00Z"
        energy_kwh: 120.5
      - vehicle_id: "bus_101"      # April — counts
        depot_id: "11111111-1111-4111-8111-111111111111"
        start_time: "2026-04-20T08:00:00Z"
        end_time: "2026-04-20T11:00:00Z"
        energy_kwh: 200.0
      - vehicle_id: "bus_101"      # March — out of window, excluded
        depot_id: "11111111-1111-4111-8111-111111111111"
        start_time: "2026-03-15T08:00:00Z"
        end_time: "2026-03-15T09:00:00Z"
        energy_kwh: 90.0
      - vehicle_id: "bus_202"      # different vehicle, excluded
        depot_id: "11111111-1111-4111-8111-111111111111"
        start_time: "2026-04-12T08:00:00Z"
        end_time: "2026-04-12T10:00:00Z"
        energy_kwh: 150.0
  llm_trace:
    - content:
        - type: tool_use
          id: "en01_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT COUNT(*) AS n_sessions, SUM(energy_kwh) AS total_kwh
              FROM agent_views.sessions($1)
              WHERE vehicle_id = 'bus_101'
                AND start_time >= '2026-04-01' AND start_time < '2026-05-01'
    - content:
        - type: tool_use
          id: "en01_a"
          name: emit_final_answer
          input:
            text: "Bus_101 consumed 320.5 kWh across 2 sessions in April 2026."
            row_evidence: 1
  expected:
    status: success
    agent_views_used: ["sessions"]
    sql_validator_rejected: false
    final_answer_must_include: ["320.5 kWh", "2 sessions"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]

# ── operations status ────────────────────────────────────────────────────────

- id: ops_08
  category: ops_status
  question: "Which chargers were faulted yesterday?"
  description: >
    Names the chargers currently Faulted whose status flipped yesterday
    (2026-05-24). Uses connector_status_latest, not alerts: the alerts view
    exposes no station/charger id, so it cannot answer "which chargers" — the
    PLAN.md hint (agent_views.alerts) predates that view's final shape.
    CP-01 also has an earlier Available row to exercise the view's
    latest-row-per-(station,connector) DISTINCT ON.
  scenario_now: "2026-05-25T09:00:00Z"
  auth:
    organization_id: "bb000000-0000-4000-8000-0000000000bb"
  graph_snapshot:
    depots:
      - depot_id: "11111111-1111-4111-8111-111111111111"
        name: "Vilnius"
    connector_status:
      - station_id: "CP-01"        # latest = Faulted yesterday → counts
        connector_id: 1
        depot_id: "11111111-1111-4111-8111-111111111111"
        status: "Available"
        timestamp: "2026-05-20T08:00:00Z"
      - station_id: "CP-01"
        connector_id: 1
        depot_id: "11111111-1111-4111-8111-111111111111"
        status: "Faulted"
        error_code: "GroundFailure"
        timestamp: "2026-05-24T14:00:00Z"
      - station_id: "CP-02"        # Faulted yesterday → counts
        connector_id: 1
        depot_id: "11111111-1111-4111-8111-111111111111"
        status: "Faulted"
        error_code: "OverCurrentFailure"
        timestamp: "2026-05-24T16:00:00Z"
      - station_id: "CP-03"        # Available → excluded
        connector_id: 1
        depot_id: "11111111-1111-4111-8111-111111111111"
        status: "Available"
        timestamp: "2026-05-24T10:00:00Z"
  llm_trace:
    - content:
        - type: tool_use
          id: "ops08_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT station_id FROM agent_views.connector_status_latest($1)
              WHERE status = 'Faulted'
                AND last_changed_at >= '2026-05-24' AND last_changed_at < '2026-05-25'
              ORDER BY station_id
    - content:
        - type: tool_use
          id: "ops08_a"
          name: emit_final_answer
          input:
            text: "Two chargers were faulted yesterday: CP-01 and CP-02."
            row_evidence: 2
  expected:
    status: success
    agent_views_used: ["connector_status_latest"]
    sql_validator_rejected: false
    final_answer_must_include: ["CP-01", "CP-02"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]

# ── pricing + market context ─────────────────────────────────────────────────

- id: pm_15
  category: pricing_market
  question: "What were the 5 highest electricity prices last week?"
  description: >
    ORDER BY price_per_kwh DESC LIMIT 5 over the trailing week
    (2026-05-18..2026-05-25). prices_hourly is a hypertable function so the
    query carries a bounding predicate on `hour`. Prices are EUR/MWh in the
    fixture; the view returns EUR/kWh (= MWh / 1000).
  scenario_now: "2026-05-25T12:00:00Z"
  auth:
    organization_id: "bb000000-0000-4000-8000-0000000000bb"
  graph_snapshot:
    depots:
      - depot_id: "11111111-1111-4111-8111-111111111111"
        name: "Vilnius"
        entsoe_zone: "10YLT-1001A0008Q"
    electricity_prices:
      - { time: "2026-05-19T08:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 250.0 }
      - { time: "2026-05-19T09:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 230.0 }
      - { time: "2026-05-19T10:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 210.0 }
      - { time: "2026-05-19T11:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 190.0 }
      - { time: "2026-05-19T12:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 170.0 }
      - { time: "2026-05-20T08:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 150.0 }
      - { time: "2026-05-20T09:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 130.0 }
      - { time: "2026-05-20T10:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 110.0 }
  llm_trace:
    - content:
        - type: tool_use
          id: "pm15_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT hour, price_per_kwh FROM agent_views.prices_hourly($1)
              WHERE hour >= '2026-05-18' AND hour < '2026-05-25'
              ORDER BY price_per_kwh DESC LIMIT 5
    - content:
        - type: tool_use
          id: "pm15_a"
          name: emit_final_answer
          input:
            text: >-
              The five highest electricity prices last week were 0.25, 0.23, 0.21,
              0.19 and 0.17 EUR/kWh, peaking at 0.25 EUR/kWh on 19 May.
            row_evidence: 5
  expected:
    status: success
    agent_views_used: ["prices_hourly"]
    sql_validator_rejected: false
    final_answer_must_include: ["0.25", "0.17", "EUR/kWh"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]

                AND start_time >= '2026-05-18' AND start_time < '2026-05-25'
              ORDER BY cost_total DESC
    - content:
        - type: tool_use
          id: "en07_a"
          name: emit_final_answer
          input: { text: "Yes — bus_101's session on 19 May cost 150 EUR, above the 100 EUR mark.", row_evidence: 1 }

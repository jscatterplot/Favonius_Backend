- id: pm_17
  category: pricing_market
  question: "What was the average price during morning peak (07-09 local) last week?"
  description: >
    AVG(price_per_kwh) over last week, restricted to the 07:00-09:00 LOCAL
    window via `hour AT TIME ZONE 'Europe/Vilnius'`. May is EEST (UTC+3), so
    04:00/05:00Z = 07:00/08:00 local (peak); 10:00Z = 13:00 local (excluded).
    The week bound on `hour` satisfies the hypertable predicate; the EXTRACT
    filter selects the peak hours. Peak avg = (0.20 + 0.22) / 2 = 0.21 EUR/kWh.
  scenario_now: "2026-05-25T12:00:00Z"
  graph_snapshot:
    depots:
      - *dep_vil
    electricity_prices:
      - { time: "2026-05-19T04:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 200.0 }
      - { time: "2026-05-19T05:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 220.0 }
      - { time: "2026-05-19T10:00:00Z", node_id: "10YLT-1001A0008Q", lmp_price_mwh: 100.0 }
  llm_trace:
    - content:
        - type: tool_use
          id: "pm17_q"
          name: run_select_ts
          input:
            sql: >-
              SELECT AVG(price_per_kwh) AS avg_peak FROM agent_views.prices_hourly($1)
              WHERE hour >= '2026-05-18' AND hour < '2026-05-25'
                AND EXTRACT(HOUR FROM (hour AT TIME ZONE 'Europe/Vilnius')) IN (7, 8)
    - content:
        - type: tool_use
          id: "pm17_a"
          name: emit_final_answer
          input: { text: "The average morning-peak (07-09 local) price last week was 0.21 EUR/kWh.", row_evidence: 1 }
  expected:
    status: success
    agent_views_used: ["prices_hourly"]
    sql_validator_rejected: false
    final_answer_must_include: ["0.21", "EUR/kWh"]
    final_answer_must_not_include: ["SELECT", "UUID", "agent_views"]


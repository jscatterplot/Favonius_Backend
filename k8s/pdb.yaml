# Pod Disruption Budget for Favonius API
# Reference: PRD_v2.md Section 10.2 (≥ 99.5% availability); Development Plan Phase 7 Step 7.2

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: favonius-api-pdb
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: disruption-budget
spec:
  minAvailable: 1  # Ensures at least one pod running during updates
  selector:
    matchLabels:
      app.kubernetes.io/name: favonius-api
      app.kubernetes.io/component: api-server

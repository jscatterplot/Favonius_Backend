# Ingress for WebSocket connections
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-handler-ingress
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: websocket-handler-service
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    nginx.ingress.kubernetes.io/session-cookie-name: "websocket-affinity"
    nginx.ingress.kubernetes.io/session-cookie-expires: "86400"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/connection-proxy-header: "upgrade"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - ocpp.yourdomain.com
  #   secretName: websocket-handler-tls-ingress
  rules:
  - host: ocpp.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: websocket-handler-service
            port:
              name: websocket

---
# Separate ingress for monitoring/metrics (optional)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: websocket-handler-monitoring
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: ingress-monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - Monitoring"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - monitoring.yourdomain.com
  #   secretName: websocket-handler-monitoring-tls
  rules:
  - host: monitoring.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: websocket-handler-internal
            port:
              name: metrics
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: websocket-handler-internal
            port:
              name: health

---
# Basic auth secret for monitoring endpoints
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-auth
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: monitoring-auth
type: Opaque
stringData:
  auth: |
    admin:$2y$10$example_hash_replace_with_real_hash

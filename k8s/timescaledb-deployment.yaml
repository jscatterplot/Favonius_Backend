# TimescaleDB StatefulSet for Favonius Energy Platform
# Reference: PRD_v2.md Section 6.1; Development Plan Phase 7 Step 7.2
#
# Note: For production, consider using managed TimescaleDB services:
# - AWS RDS for PostgreSQL with TimescaleDB extension
# - Google Cloud SQL for PostgreSQL with TimescaleDB extension
# - Azure Database for PostgreSQL with TimescaleDB extension
#
# This StatefulSet is provided for development/testing or self-hosted deployments.

apiVersion: v1
kind: Service
metadata:
  name: timescaledb-service
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
    protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
spec:
  serviceName: timescaledb-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescaledb
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: postgresql
        image: timescale/timescaledb:latest-pg16
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: timescaledb-config
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: timescaledb-config
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: timescaledb-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard  # Change to your storage class
      resources:
        requests:
          storage: 100Gi

---
# ConfigMap for TimescaleDB configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-config
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: config
data:
  POSTGRES_USER: "favonius"
  POSTGRES_DB: "favonius"
  # PostgreSQL configuration
  shared_buffers: "512MB"
  effective_cache_size: "1536MB"
  maintenance_work_mem: "128MB"
  checkpoint_completion_target: "0.9"
  wal_buffers: "16MB"
  default_statistics_target: "100"
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  work_mem: "4MB"
  min_wal_size: "1GB"
  max_wal_size: "4GB"

---
# Secret for TimescaleDB credentials
# Note: Replace with actual values in production
apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-secrets
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-in-production"

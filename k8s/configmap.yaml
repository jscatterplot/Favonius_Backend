apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-handler-config
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: config
data:
  # WebSocket configuration
  WEBSOCKET_HOST: "0.0.0.0"
  WEBSOCKET_PORT: "9000"
  MAX_CONNECTIONS: "10000"
  HEARTBEAT_INTERVAL: "30"
  MESSAGE_TIMEOUT: "60"
  MAX_MESSAGE_SIZE: "65536"
  RATE_LIMIT_PER_MINUTE: "100"
  
  # Redis configuration
  REDIS_MAX_CONNECTIONS: "100"
  REDIS_SOCKET_TIMEOUT: "5"
  
  # Kafka configuration
  KAFKA_CHARGER_EVENTS_TOPIC: "charger.events"
  KAFKA_OPTIMIZATION_COMMANDS_TOPIC: "optimization.commands"
  KAFKA_CONSUMER_GROUP: "websocket-handler"
  
  # Monitoring configuration
  METRICS_PORT: "8080"
  HEALTH_CHECK_PORT: "8081"
  LOG_LEVEL: "INFO"
  ENABLE_TELEMETRY: "true"
  
  # Application configuration
  ENVIRONMENT: "production"
  DEBUG: "false"
  
  # Performance tuning
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: config
data:
  redis.conf: |
    # Redis configuration for EV charging platform
    
    # Network settings
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # Memory management
    maxmemory 4gb
    maxmemory-policy allkeys-lru
    maxmemory-samples 10
    
    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    
    # AOF persistence
    appendonly yes
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Logging
    loglevel notice
    
    # Security
    # requirepass will be set via secret
    
    # Performance
    hz 10
    dynamic-hz yes
    
    # Client management
    maxclients 10000

---
# Favonius API Configuration
# Reference: PRD_v2.md Section 7.1, 8.2; Development Plan Phase 7 Step 7.2
apiVersion: v1
kind: ConfigMap
metadata:
  name: favonius-api-config
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: config
data:
  # API server configuration
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  
  # OCPP server configuration (per PRD Section 7.2)
  OCPP_SERVER_ENABLED: "true"
  OCPP_SERVER_HOST: "0.0.0.0"
  OCPP_SERVER_PORT: "9000"
  
  # Optimization configuration (per PRD Section 8.2)
  OPTIMIZATION_TIMEOUT: "60"  # seconds
  OPTIMIZATION_MIP_GAP: "0.01"  # 1%
  
  # Database configuration (non-sensitive)
  DATABASE_HOST: "timescaledb-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "favonius"
  DATABASE_USER: "favonius"
  
  # Logging configuration
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  
  # Python environment
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: "/app"

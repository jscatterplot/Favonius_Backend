apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-handler
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: server
    app.kubernetes.io/version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: websocket-handler
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: websocket-handler
        app.kubernetes.io/component: server
        app.kubernetes.io/version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: websocket-handler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: websocket-handler
        image: ev-charging/websocket-handler:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: websocket
          containerPort: 9000
          protocol: TCP
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        env:
        # Configuration from ConfigMap
        - name: WEBSOCKET_HOST
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: WEBSOCKET_HOST
        - name: WEBSOCKET_PORT
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: WEBSOCKET_PORT
        - name: MAX_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: MAX_CONNECTIONS
        - name: HEARTBEAT_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: HEARTBEAT_INTERVAL
        - name: MESSAGE_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: MESSAGE_TIMEOUT
        - name: METRICS_PORT
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: METRICS_PORT
        - name: HEALTH_CHECK_PORT
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: HEALTH_CHECK_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: websocket-handler-config
              key: ENVIRONMENT
        
        # Secrets
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: REDIS_URL
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: REDIS_PASSWORD
        - name: KAFKA_BROKERS
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: KAFKA_BROKERS
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: INTERNAL_API_KEY
        
        # Pod information
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        
        livenessProbe:
          httpGet:
            path: /liveness
            port: health
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /readiness
            port: health
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sleep", "10"]
        
        terminationGracePeriodSeconds: 30
        
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        # Uncomment for TLS certificates
        # - name: tls-certs
        #   mountPath: /app/certs
        #   readOnly: true
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
      - name: data
        emptyDir:
          sizeLimit: 100Mi
      # Uncomment for TLS certificates
      # - name: tls-certs
      #   secret:
      #     secretName: websocket-handler-tls
      #     defaultMode: 0400
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - websocket-handler
              topologyKey: kubernetes.io/hostname
      
      nodeSelector:
        kubernetes.io/os: linux
      
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 300

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: websocket-handler
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: serviceaccount

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ev-charging
  name: websocket-handler
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: websocket-handler
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: websocket-handler
  namespace: ev-charging
roleRef:
  kind: Role
  name: websocket-handler
  apiGroup: rbac.authorization.k8s.io
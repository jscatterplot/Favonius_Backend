# Headless service for Redis cluster internal communication
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-headless
  namespace: redis-cluster
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: service-headless
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: database
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  - name: cluster-bus
    port: 16379
    targetPort: cluster-bus
    protocol: TCP

---
# Load balancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-service
  namespace: redis-cluster
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # For internal load balancer (private subnet)
    # service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: database
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  sessionAffinity: None

---
# NodePort service for development/testing
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-nodeport
  namespace: redis-cluster
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: service-nodeport
  annotations:
    service.description: "Redis cluster NodePort service for development access"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: database
  ports:
  - name: redis-0
    port: 7000
    targetPort: redis
    nodePort: 30000
    protocol: TCP
  - name: redis-1
    port: 7001
    targetPort: redis
    nodePort: 30001
    protocol: TCP
  - name: redis-2
    port: 7002
    targetPort: redis
    nodePort: 30002
    protocol: TCP

---
# Service monitor for Prometheus scraping (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-cluster
  namespace: redis-cluster
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cluster
      app.kubernetes.io/component: database
  endpoints:
  - port: redis
    interval: 30s
    path: /metrics
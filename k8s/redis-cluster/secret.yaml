apiVersion: v1
kind: Secret
metadata:
  name: redis-cluster-auth
  namespace: redis-cluster
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  # Redis cluster password - change in production!
  REDIS_PASSWORD: "redis-cluster-production-password-change-me"
  
  # Optional: Redis admin user for monitoring
  REDIS_ADMIN_USER: "admin"
  REDIS_ADMIN_PASSWORD: "admin-password-change-me"

---

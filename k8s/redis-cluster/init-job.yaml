# Job to initialize Redis cluster after StatefulSet is ready
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: redis-cluster
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: init-job
spec:
  ttlSecondsAfterFinished: 300  # Clean up after 5 minutes
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cluster
        app.kubernetes.io/component: init-job
    spec:
      restartPolicy: OnFailure
      containers:
      - name: cluster-init
        image: redis:7.2-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-auth
              key: REDIS_PASSWORD
        command:
        - /bin/bash
        - /scripts/cluster-init.sh
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: scripts
        configMap:
          name: redis-cluster-config
          items:
          - key: cluster-init.sh
            path: cluster-init.sh
          defaultMode: 0755
      nodeSelector:
        kubernetes.io/os: linux

---
# CronJob to monitor cluster health
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-cluster-health-check
  namespace: redis-cluster
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/component: health-check
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: redis-cluster
            app.kubernetes.io/component: health-check
        spec:
          restartPolicy: OnFailure
          containers:
          - name: health-check
            image: redis:7.2-alpine
            env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-cluster-auth
                  key: REDIS_PASSWORD
            command:
            - /bin/bash
            - -c
            - |
              echo "=== Redis Cluster Health Check - $(date) ==="
              
              # Check cluster state
              for i in {0..5}; do
                if redis-cli -h redis-cluster-$i.redis-cluster-headless -p 6379 -a "$REDIS_PASSWORD" ping >/dev/null 2>&1; then
                  role=$(redis-cli -h redis-cluster-$i.redis-cluster-headless -p 6379 -a "$REDIS_PASSWORD" info replication | grep "role:" | cut -d: -f2 | tr -d '\r')
                  memory=$(redis-cli -h redis-cluster-$i.redis-cluster-headless -p 6379 -a "$REDIS_PASSWORD" info memory | grep "used_memory_human:" | cut -d: -f2 | tr -d '\r')
                  echo "✓ redis-cluster-$i ($role) - Memory: $memory"
                else
                  echo "✗ redis-cluster-$i - UNREACHABLE"
                fi
              done
              
              # Check cluster info
              if cluster_info=$(redis-cli -h redis-cluster-0.redis-cluster-headless -p 6379 -a "$REDIS_PASSWORD" cluster info 2>/dev/null); then
                state=$(echo "$cluster_info" | grep "cluster_state:" | cut -d: -f2 | tr -d '\r')
                slots=$(echo "$cluster_info" | grep "cluster_slots_assigned:" | cut -d: -f2 | tr -d '\r')
                echo "Cluster state: $state, Slots: $slots"
                
                if [ "$state" != "ok" ]; then
                  echo "WARNING: Cluster state is not OK!"
                  exit 1
                fi
              else
                echo "ERROR: Cannot get cluster info"
                exit 1
              fi
              
              echo "Health check completed successfully"
            resources:
              requests:
                memory: "32Mi"
                cpu: "50m"
              limits:
                memory: "64Mi"
                cpu: "100m"
          nodeSelector:
            kubernetes.io/os: linux
# Favonius API Ingress Configuration
# Reference: PRD_v2.md Section 10.3 (TLS, HTTPS/WSS); Development Plan Phase 7 Step 7.2
#
# Requirements:
# - HTTPS required for all API endpoints (per PRD Section 10.3)
# - WSS required for OCPP in production (per PRD Section 10.3)
# - TLS 1.3 support
# - Cert-manager for automatic certificate management

# REST API Ingress (HTTPS)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: favonius-api-ingress
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS 1.3 required per PRD Section 10.3
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384"
    # Rate limiting per PRD Section 10.4
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "1000"
    # Cert-manager for automatic TLS certificate management
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"  # Configure for production
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  tls:
  - hosts:
    - api.yourdomain.com  # Replace with your domain
    secretName: favonius-api-tls-ingress
  rules:
  - host: api.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: favonius-api-service
            port:
              number: 8000

---
# OCPP WebSocket Ingress (WSS)
# Per PRD Section 9.1: OCPP WebSocket connections require WSS in production
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: favonius-ocpp-ingress
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: ingress-ocpp
  annotations:
    kubernetes.io/ingress.class: nginx
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: favonius-api-service
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    # Session affinity for WebSocket connections
    nginx.ingress.kubernetes.io/session-cookie-name: "ocpp-affinity"
    nginx.ingress.kubernetes.io/session-cookie-expires: "86400"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/connection-proxy-header: "upgrade"
    # TLS 1.3 required per PRD Section 10.3
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384"
    # Cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Force HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - ocpp.yourdomain.com  # Replace with your domain
    secretName: favonius-ocpp-tls-ingress
  rules:
  - host: ocpp.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: favonius-api-service
            port:
              name: websocket

---
# Monitoring/Metrics Ingress (optional, with basic auth)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: favonius-api-monitoring
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: ingress-monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: favonius-monitoring-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - Monitoring"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTPS required for all API endpoints in production per PRD Section 10.3
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - monitoring.yourdomain.com  # Replace with your domain
    secretName: favonius-api-monitoring-tls
  rules:
  - host: monitoring.yourdomain.com  # Replace with your domain
    http:
      paths:
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: favonius-api-internal
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: favonius-api-internal
            port:
              number: 8000

---
# Basic auth secret for monitoring endpoints
apiVersion: v1
kind: Secret
metadata:
  name: favonius-monitoring-auth
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: monitoring-auth
type: Opaque
stringData:
  auth: |
    admin:$2y$10$example_hash_replace_with_real_hash
    # Generate with: htpasswd -c auth admin
    # Then base64 encode and replace above

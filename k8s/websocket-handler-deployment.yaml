apiVersion: v1
kind: Namespace
metadata:
  name: ev-charging-platform
  labels:
    name: ev-charging-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-handler-config
  namespace: ev-charging-platform
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  WEBSOCKET_HOST: "0.0.0.0"
  WEBSOCKET_PORT: "9000"
  MAX_CONNECTIONS: "1000"
  HEARTBEAT_INTERVAL: "30"
  MESSAGE_TIMEOUT: "60"
  MAX_MESSAGE_SIZE: "65536"
  RATE_LIMIT_PER_MINUTE: "10000"
  TIMESCALE_MAX_CONNECTIONS: "100"
  TIMESCALE_POOL_SIZE: "20"
  TIMESCALE_STATEMENT_TIMEOUT: "30"
  TIMESCALE_IDLE_TIMEOUT: "600"
  SUPABASE_MAX_CONNECTIONS: "20"
  METRICS_PORT: "8080"
  HEALTH_CHECK_PORT: "8081"
  LOG_LEVEL: "INFO"
  ENABLE_TELEMETRY: "true"
  EXPECTED_STATIONS: "100"
  RATE_LIMIT_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: websocket-handler-secrets
  namespace: ev-charging-platform
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  TIMESCALE_SERVICE_URL: cG9zdGdyZXNxbDovL3VzZXJuYW1lOnBhc3N3b3JkQGhvc3Q6cG9ydC9kYXRhYmFzZT9zc2xtb2RlPXJlcXVpcmU=
  SUPABASE_URL: aHR0cHM6Ly95b3VyLXByb2plY3Quc3VwYWJhc2UuY28=
  SUPABASE_ANON_KEY: eW91ci1hbm9uLWtleQ==
  SUPABASE_SERVICE_KEY: eW91ci1zZXJ2aWNlLWtleQ==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-handler
  namespace: ev-charging-platform
  labels:
    app: websocket-handler
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: websocket-handler
  template:
    metadata:
      labels:
        app: websocket-handler
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: websocket-handler
        image: ev-charging-platform/websocket-handler:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: websocket
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        env:
        - name: TIMESCALE_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: TIMESCALE_SERVICE_URL
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: SUPABASE_URL
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: SUPABASE_ANON_KEY
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: websocket-handler-secrets
              key: SUPABASE_SERVICE_KEY
        envFrom:
        - configMapRef:
            name: websocket-handler-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readiness
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: certs
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: logs
        emptyDir: {}
      - name: certs
        secret:
          secretName: websocket-handler-certs
          optional: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-handler-service
  namespace: ev-charging-platform
  labels:
    app: websocket-handler
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
spec:
  type: LoadBalancer
  selector:
    app: websocket-handler
  ports:
  - name: websocket
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: health
    port: 8081
    targetPort: 8081
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-handler-headless
  namespace: ev-charging-platform
  labels:
    app: websocket-handler
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: websocket-handler
  ports:
  - name: websocket
    port: 9000
    targetPort: 9000
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: websocket-handler-pdb
  namespace: ev-charging-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: websocket-handler
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websocket-handler-hpa
  namespace: ev-charging-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websocket-handler
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: websocket-handler-netpol
  namespace: ev-charging-platform
spec:
  podSelector:
    matchLabels:
      app: websocket-handler
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8081
  - ports:
    - protocol: TCP
      port: 9000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    ports:
    - protocol: TCP
      port: 5432
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: websocket-handler-certs
  namespace: ev-charging-platform
type: kubernetes.io/tls
data:
  # Base64 encoded certificate files
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...
  ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: websocket-handler-backup
  namespace: ev-charging-platform
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: postgres:14
            command:
            - /bin/bash
            - -c
            - |
              pg_dump -h $DB_HOST -U $DB_USER $DB_NAME > /backup/backup_$(date +%Y%m%d).sql
              aws s3 cp /backup/backup_$(date +%Y%m%d).sql s3://ev-charging-backups/
            env:
            - name: DB_HOST
              value: "timescaledb-service"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: websocket-handler-secrets
                  key: DB_USER
            - name: DB_NAME
              value: "ev_charging"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: secret-access-key
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            emptyDir: {}
          restartPolicy: OnFailure

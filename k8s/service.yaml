apiVersion: v1
kind: Service
metadata:
  name: websocket-handler-service
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: server
  ports:
  - name: websocket
    port: 9000
    targetPort: websocket
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
  sessionAffinity: ClientIP  # Important for WebSocket connections
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
# Internal service for health checks and metrics
apiVersion: v1
kind: Service
metadata:
  name: websocket-handler-internal
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: service-internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: server
  ports:
  - name: health
    port: 8081
    targetPort: health
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP

---
# Headless service for direct pod communication
apiVersion: v1
kind: Service
metadata:
  name: websocket-handler-headless
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: service-headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: server
  ports:
  - name: websocket
    port: 9000
    targetPort: websocket
    protocol: TCP
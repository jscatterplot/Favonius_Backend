# Favonius API RBAC Configuration
# Reference: PRD_v2.md Section 10.3; Development Plan Phase 7 Step 7.2

apiVersion: v1
kind: ServiceAccount
metadata:
  name: favonius-api
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: serviceaccount

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ev-charging
  name: favonius-api
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: rbac
rules:
# Read ConfigMaps and Secrets for configuration
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Read Pod information for health checks and metrics
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: favonius-api
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: favonius-api
  namespace: ev-charging
roleRef:
  kind: Role
  name: favonius-api
  apiGroup: rbac.authorization.k8s.io

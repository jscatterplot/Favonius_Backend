# Secret template - replace with actual values in production
apiVersion: v1
kind: Secret
metadata:
  name: websocket-handler-secrets
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Redis credentials
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PASSWORD: "change-me-in-production"
  
  # Kafka configuration
  KAFKA_BROKERS: "kafka-service:9092"
  
  # Internal API keys
  INTERNAL_API_KEY: "change-me-in-production"
  
  # TLS certificates required for production per PRD Section 10.3
  # OCPP authentication: Basic auth + TLS 1.3 (wss:// required in production)
  TLS_CERT_PATH: "/app/certs/server.crt"
  TLS_KEY_PATH: "/app/certs/server.key"
  TLS_CA_PATH: "/app/certs/ca.crt"
  TLS_VERIFY_CLIENT: "false"
  
---
# TLS Secret for certificates (required for production per PRD Section 10.3)
# Note: Replace base64 encoded values with actual certificates
# Use cert-manager for automatic certificate management (recommended)
apiVersion: v1
kind: Secret
metadata:
  name: websocket-handler-tls
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: websocket-handler
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTi... # base64 encoded certificate (replace with actual)
  tls.key: LS0tLS1CRUdJTi... # base64 encoded private key (replace with actual)

---
# Favonius API Secrets
# Reference: PRD_v2.md Section 10.3; Development Plan Phase 7 Step 7.2
# Note: Replace with actual values in production. Use external-secrets-operator or
# cloud provider secrets manager (AWS Secrets Manager, GCP Secret Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: favonius-api-secrets
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Database password (per PRD Section 10.3)
  DATABASE_PASSWORD: "change-me-in-production"
  
  # JWT secret key (per PRD Section 10.3)
  # Generate with: openssl rand -hex 32
  JWT_SECRET_KEY: "change-me-in-production-generate-with-openssl-rand-hex-32"
  
  # Gurobi license file content (per PRD Section 8.2)
  # This should contain the actual Gurobi license file content
  gurobi.lic: |
    # Replace with actual Gurobi license file content
    # Or mount from external secret manager

---
# TLS Secret for Favonius API (per PRD Section 10.3)
# Note: Use cert-manager for automatic certificate management (recommended)
# This is a template - cert-manager will create the actual secret
apiVersion: v1
kind: Secret
metadata:
  name: favonius-api-tls
  namespace: ev-charging
  labels:
    app.kubernetes.io/name: favonius-api
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Replace with base64 encoded certificate and key
  # Or let cert-manager manage this automatically
  tls.crt: LS0tLS1CRUdJTi... # base64 encoded certificate (replace with actual)
  tls.key: LS0tLS1CRUdJTi... # base64 encoded private key (replace with actual)

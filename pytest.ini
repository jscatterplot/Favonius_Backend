[tool:pytest]
# Pytest configuration for Favonius Energy V2G System

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    load: Load tests
    e2e: End-to-end tests
    slow: Slow running tests
    citrineos: Tests requiring CitrineOS
    docker: Tests requiring Docker
    compliance: OCPP compliance tests
    critical: Critical path tests
    edge_case: Edge case tests
    security: Security tests
    acceptance: PRD acceptance criteria tests (AT-01 through AT-05)
    performance: Performance benchmark tests
    database: Tests requiring real database connection
    snapshot: Snapshot tests against the live LLM (gated; nightly only)
    workflow_golden: Parametrised workflow eval scenarios (real DB required)
    agent_sql_golden: Parametrised agent-SQL eval scenarios (real TS+static DB pair required)

# Async configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Coverage thresholds
fail_under = 80
show_missing = True
precision = 2

# Test timeout
timeout = 300
timeout_method = thread



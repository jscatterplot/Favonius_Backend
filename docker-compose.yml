# Favonius Energy EV Fleet Depot Optimization Platform
# Docker Compose Configuration
#
# Reference: PRD_v2.md Section 7.1, Development Plan Phase 7
#
# Usage:
#   Development:     docker-compose up -d
#   With simulator:  docker-compose --profile simulation up -d
#   Logs:           docker-compose logs -f api

version: '3.8'

services:
  # TimescaleDB for time-series data storage
  # Per PRD Section 5.2: TimescaleDB for telemetry with compression
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: favonius-timescaledb
    environment:
      POSTGRES_USER: favonius
      POSTGRES_PASSWORD: ${DB_PASSWORD:-favonius_dev}
      POSTGRES_DB: favonius
      TIMESCALEDB_TELEMETRY: off
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U favonius -d favonius"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Main API service (FastAPI + Optimization Engine + OCPP Server)
  # Per PRD Section 7.1: REST API endpoints
  # Per PRD Section 8.2: Gurobi primary, HiGHS fallback
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: favonius-api
    ports:
      - "8000:8000"   # REST API (HTTPS in production per PRD Section 10.3)
      - "9000:9000"   # OCPP WebSocket (WSS in production per PRD Section 10.3)
    environment:
      # Database configuration
      DATABASE_URL: postgresql://favonius:${DB_PASSWORD:-favonius_dev}@timescaledb:5432/favonius

      # Gurobi license (required for primary solver per PRD Section 8.2)
      GUROBI_LICENSE_FILE: /opt/gurobi/gurobi.lic

      # API configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000

      # OCPP configuration (per PRD Section 7.2)
      OCPP_SERVER_ENABLED: "true"
      OCPP_SERVER_HOST: 0.0.0.0
      OCPP_SERVER_PORT: 9000

      # Optimization configuration (per PRD Section 8.2)
      OPTIMIZATION_TIMEOUT: 60  # seconds
      OPTIMIZATION_MIP_GAP: 0.01  # 1%

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # CORS (configure for production)
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./gurobi.lic:/opt/gurobi/gurobi.lic:ro  # Gurobi license file (optional)
      - ./config:/app/config:ro
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'

  # OCPP Charger Simulator for testing
  # Per PRD Section 9.1: OCPP 1.6 primary
  ocpp_simulator:
    build:
      context: .
      dockerfile: Dockerfile.ocpp-simulator
    container_name: favonius-ocpp-simulator
    environment:
      OCPP_SERVER_URL: ws://api:9000/ocpp
      NUM_CHARGERS: ${NUM_CHARGERS:-10}
      CHARGER_PREFIX: ${CHARGER_PREFIX:-charger_}
      SIMULATION_MODE: ${SIMULATION_MODE:-responsive}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - simulation

  # Prometheus for metrics collection
  # Per PRD Section 10.1: Performance monitoring
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: favonius-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - api
    profiles:
      - monitoring

  # Grafana for monitoring dashboards
  # Per PRD Section 10.1: Monitoring visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: favonius-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  timescale_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: favonius-network
    driver: bridge
